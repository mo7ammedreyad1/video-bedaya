<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎨 تاريخ المسمار والشاكوش — رحلة زمنية ثلاثية الأبعاد 🎨</title>

    <!-- روابط الخطوط الرسمية -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@500;600;700;800;900&display=swap" rel="stylesheet">

    <link rel="stylesheet" type="text/css" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css" />
    <link rel="stylesheet" type="text/css" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css" />

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body {
            background-color: #080a0f; color: #ffffff;
            font-family: 'IBM Plex Sans Arabic', 'Plus Jakarta Sans', sans-serif;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            min-height: 100vh; overflow: hidden;
        }
        #viewport {
            position: relative;
            /* 9:16 Shorts Preview: 420x746 (Internal Canvas: 1080x1920) */
            width: 420px; height: 746px;
            background: #f5f5f5;
            box-shadow: 0 25px 70px rgba(0, 0, 0, 0.65);
            border-radius: 20px; overflow: hidden;
        }
        canvas { width: 100%; height: 100%; display: block; }
        #hud {
            position: absolute; top: 16px; right: 16px;
            background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(12px);
            color: #010101; padding: 6px 14px; border-radius: 30px;
            font-size: 12px; font-weight: 700; display: flex; align-items: center; gap: 8px;
            box-shadow: 0 4px 18px rgba(0, 0, 0, 0.08); border: 1px solid rgba(0, 0, 0, 0.06); z-index: 10;
        }
        .spinner {
            width: 12px; height: 12px; border: 2px solid #e5e5e5;
            border-top: 2px solid #0a0f1d; border-radius: 50%; animation: spin 0.8s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        #controls-overlay {
            position: absolute; bottom: 16px; left: 50%; transform: translateX(-50%);
            display: flex; gap: 8px; z-index: 10; background: rgba(10, 15, 29, 0.92);
            padding: 6px 12px; border-radius: 40px; backdrop-filter: blur(14px);
            border: 1px solid rgba(255, 255, 255, 0.15);
        }
        .btn {
            font-family: inherit; font-size: 12px; font-weight: 700; padding: 6px 14px;
            border-radius: 20px; border: none; cursor: pointer; display: flex;
            align-items: center; gap: 6px; transition: all 0.2s ease;
        }
        .btn-preview { background: rgba(255, 255, 255, 0.12); color: #f8fafc; }
        .btn-preview:hover { background: rgba(255, 255, 255, 0.22); }
        .btn-render { background: #0a0f1d; color: #ffffff; }
        .btn-render:hover { background: #1e293b; }
        #console-modal {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 650px; max-width: 90vw; height: 380px; background: #0a0f1d;
            border: 1px solid #1e293b; border-radius: 12px; box-shadow: 0 30px 70px rgba(0,0,0,0.7);
            z-index: 100; display: none; flex-direction: column; overflow: hidden;
        }
        #console-header {
            background: #1e293b; padding: 10px 16px; display: flex;
            justify-content: space-between; align-items: center; font-size: 13px; font-weight: bold;
        }
        #console-output {
            flex: 1; padding: 12px; overflow-y: auto; font-family: monospace;
            font-size: 12px; color: #cbd5e1; background: #070a12; line-height: 1.5;
        }
        .log-line { margin-bottom: 4px; }
        .log-info { color: #38bdf8; }
        .log-warn { color: #facc15; }
        .log-error { color: #f87171; }
    </style>
</head>
<body>
    <div id="viewport">
        <canvas id="videoCanvas"></canvas>
        <div id="hud"><div class="spinner" id="spinner"></div><span id="status-text">جاري تحضير المشهد...</span></div>
        <div id="controls-overlay">
            <button class="btn btn-preview" id="btn-replay"><i class="ph ph-arrow-counter-clockwise"></i> تشغيل المعاينة</button>
            <button class="btn btn-preview" id="btn-toggle-console"><i class="ph ph-terminal-window"></i> سجل الأخطاء</button>
            <button class="btn btn-render" id="btn-render-start"><i class="ph-fill ph-video-camera"></i> تصدير الفيديو</button>
        </div>
    </div>

    <div id="console-modal">
        <div id="console-header">
            <span><i class="ph ph-terminal-window"></i> سجل النظام والأخطاء</span>
            <button class="btn btn-preview" id="btn-close-console" style="color:#fff; background:#ff4444; border:none; padding:4px 14px;">إغلاق</button>
        </div>
        <div id="console-output"></div>
    </div>

    <script type="module">
        // ============ 🎨 طبقة الهوية بالكامل — هنا ============
        const CONFIG = {
            fps: 30,
            width: 1080,   // المقاس الرأسي Shorts 9:16
            height: 1920,
            duration: 8.0
        };

        const OUTPUT_FILENAME = "nail_hammer_pseudo3d_timeline_shorts";
        const audioBuffer = null;

        function easeInOutCubic(t) {
            return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
        }
        function easeOutBack(t) {
            const c1 = 1.70158;
            const c3 = c1 + 1;
            return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2);
        }

        async function prepareIdentity() {
            await document.fonts.ready;
        }

        // ==================== 🔩 رسم المسمار بتقنية Pseudo-3D مع الدوران الحجمي ====================
        function drawPseudo3DNail(ctx, x, y, scale = 1, rotY = 0, angleZ = 0) {
            ctx.save();
            ctx.translate(x, y);
            ctx.rotate(angleZ);
            ctx.scale(scale, scale);

            // ظل الاستوديو ثلاثي الأبعاد
            ctx.shadowColor = "rgba(10, 15, 29, 0.25)";
            ctx.shadowBlur = 30;
            ctx.shadowOffsetY = 15;

            // حساب مسار الضوء التفاعلي بناءً على زاوية دوران Y
            const lightShift = Math.sin(rotY) * 12;

            // 1. رأس المسمار البيضاوي المجسم (3D Beveled Head)
            const headW = 96 + Math.cos(rotY) * 6;
            const headH = 26;
            ctx.beginPath();
            ctx.ellipse(0, -160, headW / 2, headH / 2, 0, 0, Math.PI * 2);
            const headGrad = ctx.createRadialGradient(-lightShift, -165, 4, 0, -160, headW / 2);
            headGrad.addColorStop(0, "#ffffff");
            headGrad.addColorStop(0.4, "#cbd5e1");
            headGrad.addColorStop(0.8, "#64748b");
            headGrad.addColorStop(1, "#1e293b");
            ctx.fillStyle = headGrad;
            ctx.fill();

            // حد الرأس العاكس
            ctx.shadowColor = "transparent";
            ctx.strokeStyle = "#ffffff";
            ctx.lineWidth = 2;
            ctx.stroke();

            // 2. ساق المسمار الأسطوانية المجسمة (3D Cylindrical Shank)
            const shaftW = 26;
            const shaftTop = -148;
            const shaftBot = 130;

            const shaftGrad = ctx.createLinearGradient(-shaftW / 2, 0, shaftW / 2, 0);
            shaftGrad.addColorStop(0, "#475569");
            shaftGrad.addColorStop(0.3 + lightShift * 0.02, "#ffffff"); // لمعة الضوء المتحركة
            shaftGrad.addColorStop(0.7, "#94a3b8");
            shaftGrad.addColorStop(1, "#1e293b");

            ctx.beginPath();
            ctx.moveTo(-shaftW / 2, shaftTop);
            ctx.lineTo(shaftW / 2, shaftTop);
            ctx.lineTo(shaftW * 0.4, shaftBot);
            ctx.lineTo(-shaftW * 0.4, shaftBot);
            ctx.closePath();
            ctx.fillStyle = shaftGrad;
            ctx.fill();

            // حزوز التثبيت الحلقية المجسمة (3D Grip Rings)
            for (let r = 0; r < 4; r++) {
                const ry = -120 + r * 28;
                ctx.beginPath();
                ctx.ellipse(0, ry, shaftW * 0.65, 4, 0, 0, Math.PI * 2);
                ctx.fillStyle = "#334155";
                ctx.fill();
                ctx.strokeStyle = "rgba(255, 255, 255, 0.9)";
                ctx.lineWidth = 1.6;
                ctx.stroke();
            }

            // 3. قمة السن الهرمية الحادة ذات الأوجه (4-Faceted 3D Tip)
            const tipApexY = 190;
            const tipBaseY = shaftBot;

            // الوجه الأيسر
            ctx.beginPath();
            ctx.moveTo(-shaftW * 0.4, tipBaseY);
            ctx.lineTo(0, tipBaseY + 6);
            ctx.lineTo(0, tipApexY);
            ctx.closePath();
            ctx.fillStyle = rotY > 0 ? "#64748b" : "#cbd5e1";
            ctx.fill();

            // الوجه الأيمن
            ctx.beginPath();
            ctx.moveTo(shaftW * 0.4, tipBaseY);
            ctx.lineTo(0, tipBaseY + 6);
            ctx.lineTo(0, tipApexY);
            ctx.closePath();
            ctx.fillStyle = rotY > 0 ? "#334155" : "#94a3b8";
            ctx.fill();

            // لمعة الحافة المركزية للسن
            ctx.beginPath();
            ctx.moveTo(0, tipBaseY + 6);
            ctx.lineTo(0, tipApexY);
            ctx.strokeStyle = "#ffffff";
            ctx.lineWidth = 2.2;
            ctx.stroke();

            ctx.restore();
        }

        // ==================== 🔨 رسم الشاكوش بتقنية Pseudo-3D مع الإضاءة الحجمية ====================
        function drawPseudo3DHammer(ctx, x, y, scale = 1, angleZ = 0, hitShock = 0) {
            ctx.save();
            ctx.translate(x, y);
            ctx.rotate(angleZ);
            ctx.scale(scale, scale);

            // ظل الشاكوش المجسم
            ctx.shadowColor = "rgba(10, 15, 29, 0.28)";
            ctx.shadowBlur = 40;
            ctx.shadowOffsetY = 20;

            // 1. مقبض الشاكوش الأسطواني المريح (3D Ergonomic Shaft)
            const handleGrad = ctx.createLinearGradient(-18, 0, 18, 0);
            handleGrad.addColorStop(0, "#334155");
            handleGrad.addColorStop(0.35, "#ffffff");
            handleGrad.addColorStop(0.7, "#cbd5e1");
            handleGrad.addColorStop(1, "#0f172a");

            ctx.beginPath();
            ctx.roundRect(-16, -30, 32, 420, 16);
            ctx.fillStyle = handleGrad;
            ctx.fill();

            // مقبض مطاطي برتقالي مجسم (3D Rubber Traction Grip)
            const gripGrad = ctx.createLinearGradient(-22, 0, 22, 0);
            gripGrad.addColorStop(0, "#9a3412");
            gripGrad.addColorStop(0.3, "#f97316");
            gripGrad.addColorStop(0.7, "#ea580c");
            gripGrad.addColorStop(1, "#431407");

            ctx.beginPath();
            ctx.roundRect(-20, 140, 40, 240, 16);
            ctx.fillStyle = gripGrad;
            ctx.fill();

            ctx.shadowColor = "transparent";
            // حزوز المطاط العريضة
            for (let g = 0; g < 8; g++) {
                ctx.fillStyle = "#0f172a";
                ctx.fillRect(-20, 170 + g * 25, 40, 6);
            }

            // 2. رأس الشاكوش الفولاذي المجسم (Polished 3D Steel Head)
            const headGrad = ctx.createLinearGradient(-120, -100, 120, -30);
            headGrad.addColorStop(0, "#ffffff");
            headGrad.addColorStop(0.25, "#e2e8f0");
            headGrad.addColorStop(0.6, "#64748b");
            headGrad.addColorStop(1, "#0f172a");

            // كتلة الطرق الرئيسية (Striking Body)
            ctx.beginPath();
            ctx.roundRect(-28, -95, 125, 68, 8);
            ctx.fillStyle = headGrad;
            ctx.fill();
            ctx.strokeStyle = "#ffffff";
            ctx.lineWidth = 2;
            ctx.stroke();

            // وجه الطرق المربع البارز (Striking Face Cap)
            ctx.beginPath();
            ctx.roundRect(85, -98, 24, 74, 4);
            ctx.fillStyle = "#cbd5e1";
            ctx.fill();
            ctx.stroke();

            // مخلب خلع المسامير المجسم المقوس (Curved 3D Claw)
            ctx.beginPath();
            ctx.moveTo(-25, -95);
            ctx.bezierCurveTo(-85, -90, -145, -50, -155, 15);
            ctx.bezierCurveTo(-135, -15, -85, -45, -25, -45);
            ctx.closePath();
            ctx.fillStyle = headGrad;
            ctx.fill();
            ctx.stroke();

            // لمعة الفولاذ المصقولة الحادة
            ctx.beginPath();
            ctx.moveTo(-15, -84);
            ctx.lineTo(80, -84);
            ctx.strokeStyle = "rgba(255, 255, 255, 0.95)";
            ctx.lineWidth = 4;
            ctx.stroke();

            ctx.restore();
        }

        // رسم كارت المعلومات الزجاجي
        function drawGlassInfoCard(ctx, x, y, w, h, radius, tagEn, titleAr, descAr, statAr, accentColor, progress = 1) {
            if (progress <= 0) return;

            ctx.save();
            ctx.translate(x, y);
            const scale = 0.86 + 0.14 * easeOutBack(progress);
            ctx.scale(scale, scale);
            ctx.globalAlpha = clamp01(progress);

            // ظل الكارت
            ctx.shadowColor = "rgba(10, 15, 29, 0.1)";
            ctx.shadowBlur = 35;
            ctx.shadowOffsetY = 16;

            // جسم الكارت
            ctx.beginPath();
            ctx.roundRect(-w / 2, -h / 2, w, h, radius);
            ctx.fillStyle = "rgba(255, 255, 255, 0.96)";
            ctx.fill();

            // الحد العاكس
            ctx.shadowColor = "transparent";
            const borderGrad = ctx.createLinearGradient(-w / 2, -h / 2, w / 2, h / 2);
            borderGrad.addColorStop(0, "#ffffff");
            borderGrad.addColorStop(0.35, accentColor);
            borderGrad.addColorStop(0.8, "rgba(226, 232, 240, 0.85)");
            borderGrad.addColorStop(1, "rgba(255, 255, 255, 0.5)");
            ctx.strokeStyle = borderGrad;
            ctx.lineWidth = 2.0;
            ctx.stroke();

            // شارة التصنيف
            const badgeW = 200, badgeH = 34;
            ctx.beginPath();
            ctx.roundRect(w / 2 - badgeW - 28, -h / 2 + 26, badgeW, badgeH, 17);
            ctx.fillStyle = "rgba(15, 23, 42, 0.05)";
            ctx.fill();
            ctx.strokeStyle = accentColor;
            ctx.lineWidth = 1.4;
            ctx.stroke();

            ctx.font = "800 12px 'Plus Jakarta Sans', sans-serif";
            ctx.fillStyle = accentColor;
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            ctx.fillText(tagEn, w / 2 - badgeW / 2 - 28, -h / 2 + 43);

            // العنوان الرئيسي
            ctx.font = "900 34px 'IBM Plex Sans Arabic', sans-serif";
            ctx.fillStyle = "#0a0f1d";
            ctx.textAlign = "right";
            ctx.textBaseline = "top";
            ctx.fillText(titleAr, w / 2 - 28, -h / 2 + 76);

            // الوصف
            ctx.font = "500 19px 'IBM Plex Sans Arabic', sans-serif";
            ctx.fillStyle = "#475569";
            ctx.fillText(descAr, w / 2 - 28, -h / 2 + 130);

            // شريط الإحصائية
            ctx.beginPath();
            ctx.roundRect(-w / 2 + 28, h / 2 - 56, w - 56, 38, 19);
            ctx.fillStyle = accentColor;
            ctx.fill();

            ctx.font = "800 15px 'IBM Plex Sans Arabic', 'Plus Jakarta Sans', sans-serif";
            ctx.fillStyle = "#ffffff";
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            ctx.fillText(statAr, 0, h / 2 - 37);

            ctx.restore();
        }

        // ==================== ⏳ الشريط الزمني التفاعلي الثابت في الأسفل ====================
        function drawBottomTimeline(ctx, time) {
            const tlW = 960, tlH = 95;
            const tlX = CONFIG.width / 2;
            const tlY = CONFIG.height - 110;

            ctx.save();
            ctx.translate(tlX, tlY);

            // هيكل الشريط الزجاجي
            ctx.shadowColor = "rgba(10, 15, 29, 0.12)";
            ctx.shadowBlur = 25;
            ctx.shadowOffsetY = 10;

            ctx.beginPath();
            ctx.roundRect(-tlW / 2, -tlH / 2, tlW, tlH, 28);
            ctx.fillStyle = "rgba(255, 255, 255, 0.96)";
            ctx.fill();

            ctx.shadowColor = "transparent";
            ctx.strokeStyle = "rgba(226, 232, 240, 0.95)";
            ctx.lineWidth = 1.8;
            ctx.stroke();

            // خط المسار الزمني في المنتصف
            const trackW = 720;
            ctx.beginPath();
            ctx.moveTo(-trackW / 2, 4);
            ctx.lineTo(trackW / 2, 4);
            ctx.strokeStyle = "#e2e8f0";
            ctx.lineWidth = 4;
            ctx.lineCap = "round";
            ctx.stroke();

            // مسار التقدم الزمني النشط
            const isStage2 = time >= 4.0;
            const progress = clamp01(time / 7.5);
            const activeLineW = trackW * progress;

            ctx.beginPath();
            ctx.moveTo(trackW / 2, 4);
            ctx.lineTo(trackW / 2 - activeLineW, 4);
            ctx.strokeStyle = isStage2 ? "#ea580c" : "#0284c7";
            ctx.lineWidth = 4;
            ctx.stroke();

            // 1. العقدة الزمنية الأولى: المسمار (3400 ق.م)
            const node1X = trackW / 2;
            const isNode1Active = time < 4.2;
            ctx.beginPath();
            ctx.arc(node1X, 4, 11, 0, Math.PI * 2);
            ctx.fillStyle = isNode1Active ? "#0284c7" : "#cbd5e1";
            ctx.fill();
            ctx.strokeStyle = "#ffffff";
            ctx.lineWidth = 3;
            ctx.stroke();

            ctx.font = "800 13px 'IBM Plex Sans Arabic', sans-serif";
            ctx.fillStyle = isNode1Active ? "#0284c7" : "#94a3b8";
            ctx.textAlign = "center";
            ctx.fillText("3400 ق.م (المسمار)", node1X, -22);

            // 2. العقدة الزمنية الثانية: الشاكوش (3.3M سنة / العصر الحديث)
            const node2X = -trackW / 2;
            const isNode2Active = time >= 4.0;
            ctx.beginPath();
            ctx.arc(node2X, 4, 11, 0, Math.PI * 2);
            ctx.fillStyle = isNode2Active ? "#ea580c" : "#cbd5e1";
            ctx.fill();
            ctx.strokeStyle = "#ffffff";
            ctx.lineWidth = 3;
            ctx.stroke();

            ctx.font = "800 13px 'IBM Plex Sans Arabic', sans-serif";
            ctx.fillStyle = isNode2Active ? "#ea580c" : "#94a3b8";
            ctx.textAlign = "center";
            ctx.fillText("3.3M سنة (الشاكوش)", node2X, -22);

            // المؤشر الزمني المنزلق الحالي
            const scrubberX = trackW / 2 - activeLineW;
            ctx.beginPath();
            ctx.arc(scrubberX, 4, 7, 0, Math.PI * 2);
            ctx.fillStyle = "#0f172a";
            ctx.fill();

            // قراءة السنة الحالية أسفل الشريط
            ctx.font = "700 12px 'Plus Jakarta Sans', sans-serif";
            ctx.fillStyle = "#64748b";
            const currentEraText = time < 4.0 ? "ERA I: ANCIENT BRONZE AGE" : "ERA II: MECHANICAL STEEL REVOLUTION";
            ctx.fillText(currentEraText, 0, 32);

            ctx.restore();
        }

        async function drawSceneAtTime(time) {
            ctx.clearRect(0, 0, CONFIG.width, CONFIG.height);

            // 1. بيئة الاستوديو الفاتحة النقية في الوضع الرأسي
            const bgGrad = ctx.createRadialGradient(
                CONFIG.width / 2, CONFIG.height / 2, 100,
                CONFIG.width / 2, CONFIG.height / 2, CONFIG.height * 0.8
            );
            bgGrad.addColorStop(0, "#ffffff");
            bgGrad.addColorStop(0.65, "#f6f7fa");
            bgGrad.addColorStop(1, "#eaecf1");
            ctx.fillStyle = bgGrad;
            ctx.fillRect(0, 0, CONFIG.width, CONFIG.height);

            // شبكة هندسية دقيقة ممتدة عبر الفضاء
            ctx.strokeStyle = "rgba(10, 15, 29, 0.035)";
            ctx.lineWidth = 1;
            const gridSize = 60;
            for (let x = 0; x < CONFIG.width; x += gridSize) {
                ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, CONFIG.height * 2); ctx.stroke();
            }
            for (let y = 0; y < CONFIG.height * 2; y += gridSize) {
                ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(CONFIG.width, y); ctx.stroke();
            }

            // ==================== 2. محرك الكاميرا الفضائية المستمرة (Spatial Vertical Travel) ====================
            // المنطقة الأولى (المسمار): Y = 680
            // المنطقة الثانية (الشاكوش): Y = 2080 (انتقال مكاني كامل لأسفل)
            const zoneNailY = 680;
            const zoneHammerY = 2080;

            let camY = zoneNailY;
            let camZoom = 1.0;

            if (time < 3.6) {
                // ثبات الكاميرا على مرحلة المسمار
                camY = zoneNailY;
                camZoom = 1.05;
            } else if (time < 4.8) {
                // انتقال الكاميرا المتصل لأسفل نحو منصة الشاكوش
                const p = easeInOutCubic((time - 3.6) / 1.2);
                camY = zoneNailY + p * (zoneHammerY - zoneNailY); // هبوط سلس من 680 إلى 2080
                camZoom = 1.05 + Math.sin(p * Math.PI) * 0.06;
            } else if (time < 7.0) {
                // ثبات الكاميرا على مرحلة الشاكوش
                camY = zoneHammerY;
                camZoom = 1.05;
            } else {
                // ارتداد بانورامي واسع وشامل يظهر المسافة الرأسية بينهما
                const p = easeInOutCubic((time - 7.0) / 1.0);
                camY = zoneHammerY - p * 600;
                camZoom = 1.05 - p * 0.22; // 0.83x تراجع شامل
            }

            ctx.save();
            ctx.translate(CONFIG.width / 2, CONFIG.height / 2 - 40);
            ctx.scale(camZoom, camZoom);
            ctx.translate(-CONFIG.width / 2, -camY);

            // ==================== 3. منصة المسمار الأولى (Zone A - Y: 680) ====================
            ctx.save();
            ctx.translate(0, 0);

            // دوران المسمار في البعد ثلاثي الأبعاد الوهمي حول محور Y
            const rotY = time * 2.2;
            const nailRotZ = -0.22 + Math.sin(time * 2) * 0.08;

            // هالة دائرية للمنصة
            ctx.beginPath();
            ctx.arc(CONFIG.width / 2, zoneNailY - 80, 200, 0, Math.PI * 2);
            ctx.fillStyle = "rgba(2, 132, 199, 0.07)";
            ctx.fill();

            // رسم المسمار بتقنية Pseudo-3D
            drawPseudo3DNail(ctx, CONFIG.width / 2, zoneNailY - 80, 1.85, rotY, nailRotZ);

            // كارت معلومات المسمار
            drawGlassInfoCard(
                ctx,
                CONFIG.width / 2, zoneNailY + 450, 920, 270, 32,
                "THE NAIL · 3400 B.C.",
                "المسمار: ثورة التشييد الأولى",
                "بدأ في مصر القديمة وعصر البرونز قبل 5400 عام، وحوّل الخشب إلى هياكل ومدن ضخمة.",
                "أول مسامير مصبوبة ومطروقة: 3400 قبل الميلاد",
                "#0284c7", 1
            );
            ctx.restore();

            // مسار انتقال متقطع يربط بين المنصتين في الفضاء
            ctx.strokeStyle = "rgba(148, 163, 184, 0.4)";
            ctx.lineWidth = 2.5;
            ctx.setLineDash([10, 8]);
            ctx.beginPath();
            ctx.moveTo(CONFIG.width / 2, zoneNailY + 620);
            ctx.lineTo(CONFIG.width / 2, zoneHammerY - 450);
            ctx.stroke();
            ctx.setLineDash([]);

            // ==================== 4. منصة الشاكوش الثانية (Zone B - Y: 2080) ====================
            ctx.save();
            ctx.translate(0, 0);

            // فيزياء الطرق الحركية للشاكوش
            let hammerAngle = -0.65;
            let hitShock = 0;

            if (time >= 4.8 && time < 5.8) {
                const strikeP = (time - 4.8) / 1.0;
                if (strikeP < 0.35) {
                    hammerAngle = -0.65 - (strikeP / 0.35) * 0.4;
                } else {
                    const hitP = (strikeP - 0.35) / 0.65;
                    hammerAngle = -1.05 + easeOutBack(hitP) * 1.0;
                    hitShock = hitP;
                }
            } else if (time >= 5.8) {
                hammerAngle = -0.05 + Math.sin(time * 2) * 0.03;
            }

            // هالة منصة الشاكوش البرتقالية
            ctx.beginPath();
            ctx.arc(CONFIG.width / 2, zoneHammerY - 100, 220, 0, Math.PI * 2);
            ctx.fillStyle = "rgba(234, 88, 12, 0.07)";
            ctx.fill();

            // رسم مسمار مغروز كهدف للطرق
            drawPseudo3DNail(ctx, CONFIG.width / 2 - 30, zoneHammerY + 120, 1.4, 0, 0);

            // رسم الشاكوش المجسم Pseudo-3D
            drawPseudo3DHammer(ctx, CONFIG.width / 2 + 100, zoneHammerY - 140, 1.7, hammerAngle, hitShock);

            // موجة الصدمة عند لحظة الطرق
            if (time >= 5.2 && time < 6.2) {
                const ripP = (time - 5.2) / 1.0;
                ctx.beginPath();
                ctx.arc(CONFIG.width / 2 - 30, zoneHammerY + 60, 20 + ripP * 200, 0, Math.PI * 2);
                ctx.strokeStyle = "#ea580c";
                ctx.lineWidth = 3.5;
                ctx.globalAlpha = (1 - ripP) * 0.8;
                ctx.stroke();
                ctx.globalAlpha = 1.0;
            }

            // كارت معلومات الشاكوش
            drawGlassInfoCard(
                ctx,
                CONFIG.width / 2, zoneHammerY + 450, 920, 270, 32,
                "THE HAMMER · 3.3M YEARS",
                "الشاكوش: مضاعف القوة الديناميكية",
                "بدأ كحجر أملس قبل 3.3 مليون عام، وتطور ليصبح أعظم أداة ميكانيكية لمضاعفة طاقة الدفع.",
                "طاقة الطرق الصدمية: 450+ نيوتن/سم²",
                "#ea580c", 1
            );
            ctx.restore();

            ctx.restore(); // استعادة الكاميرا

            // ==================== 5. رسم الشريط الزمني الثابت في الأسفل ====================
            drawBottomTimeline(ctx, time);
        }

        // ============ ⚙️ الطبقة التقنية الثابتة — من هنا تحت ============
        const canvas = document.getElementById('videoCanvas');
        const ctx = canvas.getContext('2d', { willReadFrequently: true });
        const statusText = document.getElementById('status-text');
        const spinner = document.getElementById('spinner');

        let audioAudioEl = null;
        let sharedAudioCtx = null;
        let state = { currentTime: 0, isRendering: false, animationFrameId: null };

        window.renderStatus = 'loading';

        function logToConsole(msg, type = 'info') {
            const output = document.getElementById('console-output');
            const line = document.createElement('div');
            line.className = `log-line log-${type}`;
            line.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
            output.appendChild(line);
            output.scrollTop = output.scrollHeight;
        }

        function clamp01(val) { return Math.max(0, Math.min(1, val)); }

        function layoutArabicParagraph(text, font, maxWidth, wordGap, lineHeight, centerY) {
            ctx.font = font;
            const words = text.split(' ');
            const lines = [];
            let currentWords = [], currentWidth = 0;

            words.forEach(w => {
                const wordWidth = ctx.measureText(w).width;
                const testWidth = currentWidth + (currentWords.length > 0 ? wordGap : 0) + wordWidth;
                if (testWidth > maxWidth && currentWords.length > 0) {
                    lines.push({ words: currentWords, width: currentWidth });
                    currentWords = []; currentWidth = 0;
                }
                currentWords.push({ text: w, width: wordWidth });
                currentWidth += (currentWords.length > 1 ? wordGap : 0) + wordWidth;
            });
            if (currentWords.length) lines.push({ words: currentWords, width: currentWidth });

            const totalHeight = lines.length * lineHeight;
            const startY = centerY - totalHeight / 2 + lineHeight / 2;
            const flatWords = [];

            lines.forEach((line, li) => {
                const lineY = startY + li * lineHeight;
                let currentX = (CONFIG.width / 2) + (line.width / 2);
                line.words.forEach(w => {
                    const wx = currentX - w.width;
                    flatWords.push({ text: w.text, x: wx + w.width / 2, y: lineY });
                    currentX -= (w.width + wordGap);
                });
            });
            return flatWords;
        }

        function audioBufferToWavBlob(buffer) {
            const numOfChan = buffer.numberOfChannels;
            const length = buffer.length * numOfChan * 2 + 44;
            const out = new DataView(new ArrayBuffer(length));
            let channels = [], sample, offset = 0, pos = 0;

            function setUint16(data) { out.setUint16(pos, data, true); pos += 2; }
            function setUint32(data) { out.setUint32(pos, data, true); pos += 4; }

            setUint32(0x46464952); setUint32(length - 8); setUint32(0x45564157);
            setUint32(0x20746d66); setUint32(16); setUint16(1); setUint16(numOfChan);
            setUint32(buffer.sampleRate); setUint32(buffer.sampleRate * 2 * numOfChan);
            setUint16(numOfChan * 2); setUint16(16); setUint32(0x61746164);
            setUint32(length - pos - 4);

            for (let i = 0; i < buffer.numberOfChannels; i++) channels.push(buffer.getChannelData(i));

            while (offset < buffer.length) {
                for (let i = 0; i < numOfChan; i++) {
                    sample = Math.max(-1, Math.min(1, channels[i][offset]));
                    sample = (0.5 + sample < 0 ? sample * 32768 : sample * 32767) | 0;
                    out.setInt16(pos, sample, true);
                    pos += 2;
                }
                offset++;
            }

            return new Blob([out], { type: "audio/wav" });
        }

        function getSharedAudioContext() {
            if (!sharedAudioCtx) sharedAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
            return sharedAudioCtx;
        }

        async function fetchAndDecodeAudio(url) {
            if (!/^https:\/\//i.test(url)) throw new Error(`رابط صوت غير آمن: ${url}`);
            const res = await fetch(url);
            if (!res.ok) throw new Error(`فشل جلب الصوت: ${url}`);
            const arrayBuf = await res.arrayBuffer();
            if (arrayBuf.byteLength < 1024) throw new Error(`حجم الملف صغير جداً: ${url}`);
            return getSharedAudioContext().decodeAudioData(arrayBuf);
        }

        function concatenateAudioBuffers(buffers) {
            if (!buffers || buffers.length === 0) throw new Error("مفيش أي AudioBuffer لتلزيقه");
            const sampleRate = buffers[0].sampleRate;
            const channelsCount = buffers[0].numberOfChannels;
            const totalSamples = buffers.reduce((sum, b) => sum + b.length, 0);
            const combined = getSharedAudioContext().createBuffer(channelsCount, totalSamples, sampleRate);

            let sampleOffset = 0, timeOffset = 0.0;
            const segments = [];

            for (const buf of buffers) {
                for (let ch = 0; ch < channelsCount; ch++) {
                    combined.getChannelData(ch).set(buf.getChannelData(ch), sampleOffset);
                }
                const duration = buf.duration;
                segments.push({ start: timeOffset, end: timeOffset + duration, duration });
                sampleOffset += buf.length;
                timeOffset += duration;
            }
            return { buffer: combined, segments };
        }

        async function createBrollFrameSampler(url, options = {}) {
            const videoEl = document.createElement('video');
            videoEl.crossOrigin = 'anonymous'; videoEl.muted = true;
            videoEl.playsInline = true; videoEl.preload = 'auto'; videoEl.src = url;

            await new Promise((resolve, reject) => {
                videoEl.onloadeddata = resolve;
                videoEl.onerror = () => reject(new Error(`فشل تحميل فيديو B-roll: ${url}`));
            });

            const targetW = options.width || videoEl.videoWidth;
            const targetH = options.height || videoEl.videoHeight;
            const fit = options.fit || 'cover';
            const sampleCanvas = document.createElement('canvas');
            sampleCanvas.width = targetW; sampleCanvas.height = targetH;
            const sampleCtx = sampleCanvas.getContext('2d');

            sampleCtx.drawImage(videoEl, 0, 0, 1, 1);
            let corsOk = true;
            try { sampleCtx.getImageData(0, 0, 1, 1); } catch (e) { corsOk = false; }

            if (!corsOk && options.posterFallbackUrl) {
                const posterImg = new Image(); posterImg.crossOrigin = 'anonymous';
                await new Promise((resolve, reject) => {
                    posterImg.onload = resolve;
                    posterImg.onerror = () => reject(new Error(`فشل تحميل صورة fallback: ${options.posterFallbackUrl}`));
                    posterImg.src = options.posterFallbackUrl;
                });
                return {
                    videoEl: null, isFallbackImage: true,
                    async getFrameAt(time) {
                        const zoom = 1.0 + Math.min(time / 10, 1) * 0.06;
                        const iw = posterImg.naturalWidth, ih = posterImg.naturalHeight;
                        const scale = Math.max(targetW / iw, targetH / ih) * zoom;
                        const dw = iw * scale, dh = ih * scale;
                        const dx = (targetW - dw) / 2, dy = (targetH - dh) / 2;
                        sampleCtx.clearRect(0, 0, targetW, targetH);
                        sampleCtx.drawImage(posterImg, dx, dy, dw, dh);
                        return sampleCanvas;
                    }
                };
            }

            if (!corsOk) throw new Error(`فيديو B-roll لا يدعم CORS: ${url}`);
            const useFrameCallback = typeof videoEl.requestVideoFrameCallback === 'function';

            return {
                videoEl,
                async getFrameAt(time) {
                    const seekTime = Math.min(Math.max(time, 0), Math.max(videoEl.duration - 0.01, 0));
                    await new Promise((resolve, reject) => {
                        const timeoutId = setTimeout(() => reject(new Error(`تأخر الفريم عند ${seekTime}s: ${url}`)), 5000);
                        if (useFrameCallback) {
                            videoEl.requestVideoFrameCallback(() => { clearTimeout(timeoutId); resolve(); });
                        } else {
                            videoEl.onseeked = () => { clearTimeout(timeoutId); resolve(); };
                        }
                        videoEl.currentTime = seekTime;
                    });

                    const vw = videoEl.videoWidth, vh = videoEl.videoHeight;
                    const scale = fit === 'contain' ? Math.min(targetW / vw, targetH / vh) : Math.max(targetW / vw, targetH / vh);
                    const dw = vw * scale, dh = vh * scale;
                    const dx = (targetW - dw) / 2, dy = (targetH - dh) / 2;

                    sampleCtx.clearRect(0, 0, targetW, targetH);
                    sampleCtx.drawImage(videoEl, dx, dy, dw, dh);
                    return sampleCanvas;
                }
            };
        }

        function startPreviewLoop() {
            if (state.animationFrameId) cancelAnimationFrame(state.animationFrameId);
            if (audioAudioEl) {
                audioAudioEl.currentTime = 0;
                audioAudioEl.play().catch(e => logToConsole("تنبيه الصوت: " + e.message, 'warn'));
            }

            const startTime = performance.now();
            async function loop(now) {
                if (state.isRendering) return;
                const elapsed = (now - startTime) / 1000;
                const currTime = audioAudioEl ? audioAudioEl.currentTime : (elapsed % CONFIG.duration);
                state.currentTime = currTime;
                await drawSceneAtTime(currTime);

                if (currTime < CONFIG.duration) {
                    state.animationFrameId = requestAnimationFrame(loop);
                } else {
                    statusText.textContent = "جاهز للعرض والتصدير ✓";
                    spinner.style.display = 'none';
                }
            }
            state.animationFrameId = requestAnimationFrame(loop);
        }

        const OFOQ_FRAME_FORMAT = 'image/png';
        window.__ofoqTotalFrames = 0;
        window.__ofoqFps = 0;
        window.__ofoqOutputFilename = '';
        window.__ofoqAudioWavBase64 = null;

        async function __ofoqGetFrameBatch(startFrame, count) {
            const frames = [];
            for (let i = 0; i < count; i++) {
                const frameIndex = startFrame + i;
                if (frameIndex >= window.__ofoqTotalFrames) break;
                const timestamp = frameIndex / window.__ofoqFps;
                await drawSceneAtTime(timestamp);
                const dataUrl = canvas.toDataURL(OFOQ_FRAME_FORMAT);
                frames.push(dataUrl.substring(dataUrl.indexOf(',') + 1));
            }
            return frames;
        }
        window.__ofoqGetFrameBatch = __ofoqGetFrameBatch;

        function arrayBufferToBase64(buffer) {
            let binary = '';
            const bytes = new Uint8Array(buffer);
            const chunkSize = 0x8000;
            for (let i = 0; i < bytes.length; i += chunkSize) {
                binary += String.fromCharCode.apply(null, bytes.subarray(i, i + chunkSize));
            }
            return btoa(binary);
        }

        document.getElementById('btn-replay').addEventListener('click', () => {
            statusText.textContent = "جاري عرض المعاينة...";
            spinner.style.display = 'inline-block';
            startPreviewLoop();
        });

        document.getElementById('btn-toggle-console').addEventListener('click', () => {
            const modal = document.getElementById('console-modal');
            modal.style.display = modal.style.display === 'flex' ? 'none' : 'flex';
        });

        document.getElementById('btn-close-console').addEventListener('click', () => {
            document.getElementById('console-modal').style.display = 'none';
        });

        document.getElementById('btn-render-start').addEventListener('click', () => {
            logToConsole("التصدير الفعلي يتم عبر render-runner.js (Node + ffmpeg).", 'warn');
        });

        async function init() {
            try {
                await prepareIdentity();
                canvas.width = CONFIG.width;
                canvas.height = CONFIG.height;
                window.__ofoqFps = CONFIG.fps;
                window.__ofoqTotalFrames = Math.ceil(CONFIG.duration * CONFIG.fps);
                window.__ofoqOutputFilename = `${OUTPUT_FILENAME}.mp4`;

                if (audioBuffer) {
                    const wavBlob = audioBufferToWavBlob(audioBuffer);
                    audioAudioEl = new Audio(URL.createObjectURL(wavBlob));
                    window.__ofoqAudioWavBase64 = arrayBufferToBase64(await wavBlob.arrayBuffer());
                }

                statusText.textContent = "جاهز للعرض والتصدير ✓";
                spinner.style.display = 'none';
                window.renderStatus = 'ready';
                await drawSceneAtTime(0);
            } catch (err) {
                logToConsole("خطأ أثناء التهيئة: " + err.message, 'error');
                statusText.textContent = "حدث خطأ أثناء التحميل";
                window.__renderError = err.message;
                window.renderStatus = 'error';
            }
        }
        window.addEventListener('load', init);
    </script>
