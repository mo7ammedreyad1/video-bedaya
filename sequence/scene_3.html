        let handImage = null;

        // دالة اقتطاع الشريحة الصوتية الثالثة بدقة من الملف الموحد
        function sliceAudioBuffer(sourceBuffer, startTime, duration) {
            const actx = getSharedAudioContext();
            const sampleRate = sourceBuffer.sampleRate;
            const channels = sourceBuffer.numberOfChannels;
            const startOffset = Math.floor(startTime * sampleRate);
            const frameCount = Math.min(Math.floor(duration * sampleRate), sourceBuffer.length - startOffset);

            const sliced = actx.createBuffer(channels, frameCount, sampleRate);
            for (let c = 0; c < channels; c++) {
                const sourceData = sourceBuffer.getChannelData(c);
                const targetData = sliced.getChannelData(c);
                for (let i = 0; i < frameCount; i++) {
                    targetData[i] = sourceData[startOffset + i] || 0;
                }
            }
            return sliced;
        }

        async function prepareIdentity() {
            await document.fonts.ready;

            // تحميل الصوت واقتطاع الشريحة الثالثة من (20.0s إلى 30.0s)
            const fullAudio = await fetchAndDecodeAudio(CDN_AUDIO_URL);
            audioBuffer = sliceAudioBuffer(fullAudio, 20.0, CONFIG.duration);

            // تحميل صورة يد الماوس SVG المعتمدة
            handImage = new Image();
            const svgBlob = new Blob([EXACT_SVG_STRING], { type: 'image/svg+xml;charset=utf-8' });
            const url = URL.createObjectURL(svgBlob);
            await new Promise(r => { handImage.onload = r; handImage.src = url; });
        }

        // ==================== 🛡️ رسم درع الشوكولاتة والحدود النفسية المتماسكة ====================
        function drawResilientBoundaryShield(ctx, x, y, scale = 1, solidProgress = 1, isVerified = false) {
            const w = 340, h = 420;
            ctx.save();
            ctx.translate(x, y);
            ctx.scale(scale, scale);

            // ظل الدرع الاستوديو
            ctx.shadowColor = isVerified ? "rgba(16, 185, 129, 0.22)" : "rgba(245, 158, 11, 0.18)";
            ctx.shadowBlur = 40;
            ctx.shadowOffsetY = 20;

            // مسار الدرع الهندسي الأنيق
            ctx.beginPath();
            ctx.moveTo(0, -h / 2);
            ctx.lineTo(w / 2, -h / 2 + 50);
            ctx.lineTo(w / 2, h / 2 - 120);
            ctx.quadraticCurveTo(w / 2, h / 2 - 30, 0, h / 2);
            ctx.quadraticCurveTo(-w / 2, h / 2 - 30, -w / 2, h / 2 - 120);
            ctx.lineTo(-w / 2, -h / 2 + 50);
            ctx.closePath();

            // تعبئة الشوكولاتة الصلبة الفاخرة المعاد تشكيلها
            const shieldGrad = ctx.createLinearGradient(0, -h / 2, 0, h / 2);
            shieldGrad.addColorStop(0, "#4a2818");
            shieldGrad.addColorStop(0.4, "#2d160b");
            shieldGrad.addColorStop(0.8, "#180b05");
            shieldGrad.addColorStop(1, "#0f0502");
            ctx.fillStyle = shieldGrad;
            ctx.fill();

            // الحد الذهبي الزجاجي العاكس (Gold & Specular Border)
            ctx.shadowColor = "transparent";
            const borderGrad = ctx.createLinearGradient(-w / 2, -h / 2, w / 2, h / 2);
            borderGrad.addColorStop(0, "#ffffff");
            borderGrad.addColorStop(0.3, isVerified ? "#10b981" : "#f59e0b");
            borderGrad.addColorStop(0.7, "#fef08a");
            borderGrad.addColorStop(1, "rgba(255, 255, 255, 0.5)");
            ctx.strokeStyle = borderGrad;
            ctx.lineWidth = 4;
            ctx.stroke();

            // لمعة الفولاذ المصقولة على سطح الشوكولاتة
            ctx.beginPath();
            ctx.moveTo(-w / 3, -h / 2 + 80);
            ctx.lineTo(-w / 4, h / 2 - 100);
            ctx.strokeStyle = "rgba(255, 255, 255, 0.15)";
            ctx.lineWidth = 6;
            ctx.stroke();

            // قلب الدرع المركزي
            ctx.beginPath();
            ctx.arc(0, -10, 52, 0, Math.PI * 2);
            ctx.fillStyle = isVerified ? "rgba(16, 185, 129, 0.12)" : "rgba(245, 158, 11, 0.12)";
            ctx.fill();
            ctx.strokeStyle = isVerified ? "#10b981" : "#f59e0b";
            ctx.lineWidth = 2.5;
            ctx.stroke();

            // أيقونة القفل والحدود في قلب الدرع
            if (isVerified) {
                ctx.strokeStyle = "#10b981";
                ctx.lineWidth = 5;
                ctx.lineCap = "round";
                ctx.lineJoin = "round";
                ctx.beginPath();
                ctx.moveTo(-18, -10);
                ctx.lineTo(-4, 6);
                ctx.lineTo(20, -18);
                ctx.stroke();
            } else {
                ctx.font = "900 24px 'Plus Jakarta Sans', sans-serif";
                ctx.fillStyle = "#f59e0b";
                ctx.textAlign = "center";
                ctx.textBaseline = "middle";
                ctx.fillText("CORE", 0, -10);
            }

            // شارة الحماية أسفل الدرع
            ctx.beginPath();
            ctx.roundRect(-110, h / 2 - 60, 220, 32, 16);
            ctx.fillStyle = isVerified ? "#059669" : "#d97706";
            ctx.fill();

            ctx.font = "800 13px 'IBM Plex Sans Arabic', sans-serif";
            ctx.fillStyle = "#ffffff";
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            ctx.fillText(isVerified ? "حدود نفسية متماسكة ✓" : "تأسيس الحماية الذاتية", 0, h / 2 - 44);

            ctx.restore();
        }

        async function drawSceneAtTime(time) {
            ctx.clearRect(0, 0, CONFIG.width, CONFIG.height);

            // ==================== 1. استقبال الاندفاع الكهرماني من المشهد الثاني والارتداد البانورامي ====================
            // من 0.0s -> 1.4s: استقبال تيار الكاكاو من اليسار وتلاشي الوميض الكهرماني المستلم من المشهد 2
            // من 1.4s -> 6.5s: تشكل الدرع الصلب واستقرار الحكمة ونقر الماوس SVG لتفعيل الحدود
            // من 6.5s -> 10.0s: الارتداد البانورامي النهائي (Master Grand Pullback) واستقرار المشهد كخاتمة كاملة
            let initialEntryFlash = 0;
            let camX = CONFIG.width / 2;
            let camY = CONFIG.height / 2;
            let camZoom = 1.0;

            if (time < 1.4) {
                initialEntryFlash = 1 - (time / 1.4);
                camZoom = 1.12 - (time / 1.4) * 0.12;
            } else if (time < 6.5) {
                camZoom = 1.0;
                camX = CONFIG.width / 2 + Math.sin(time * 0.8) * 15;
                camY = CONFIG.height / 2 + Math.cos(time * 0.8) * 10;
            } else {
                // الارتداد البانورامي الشامل النهائي
                const pullP = (time - 6.5) / 3.5;
                const easePull = easeInOutCubic(pullP);
                camZoom = 1.0 - easePull * 0.14; // 0.86x تراجع شامل وثابت
                camX = CONFIG.width / 2;
                camY = CONFIG.height / 2;
            }

            ctx.save();
            ctx.translate(CONFIG.width / 2, CONFIG.height / 2);
            ctx.scale(camZoom, camZoom);
            ctx.translate(-camX, -camY);

            // ==================== 2. بيئة الاستوديو الدافئة والشبكة المعمارية ====================
            const bgGrad = ctx.createRadialGradient(
                CONFIG.width / 2, CONFIG.height / 2, 120,
                CONFIG.width / 2, CONFIG.height / 2, CONFIG.width * 0.9
            );
            bgGrad.addColorStop(0, "#ffffff");
            bgGrad.addColorStop(0.65, "#faf7f4");
            bgGrad.addColorStop(1, "#f2eae2");
            ctx.fillStyle = bgGrad;
            ctx.fillRect(-400, -400, CONFIG.width + 800, CONFIG.height + 800);

            // شبكة دقيقة ممتدة
            ctx.strokeStyle = "rgba(60, 30, 15, 0.035)";
            ctx.lineWidth = 1;
            const gridSize = 50;
            for (let x = -400; x < CONFIG.width + 400; x += gridSize) {
                ctx.beginPath(); ctx.moveTo(x, -400); ctx.lineTo(x, CONFIG.height + 400); ctx.stroke();
            }
            for (let y = -400; y < CONFIG.height + 400; y += gridSize) {
                ctx.beginPath(); ctx.moveTo(-400, y); ctx.lineTo(CONFIG.width + 400, y); ctx.stroke();
            }

            // ==================== 3. استقبال تيار السائل المتدفق من جهة اليسار ====================
            if (time < 1.6) {
                const flowP = clamp01(time / 1.6);
                const streamHeadX = -100 + flowP * 740;

                ctx.beginPath();
                ctx.moveTo(-200, 540);
                ctx.lineTo(streamHeadX, 540);
                ctx.strokeStyle = "#ea580c";
                ctx.lineWidth = 16 * (1 - flowP * 0.4);
                ctx.lineCap = "round";
                ctx.shadowColor = "#f59e0b";
                ctx.shadowBlur = 25;
                ctx.stroke();
                ctx.shadowColor = "transparent";
            }

            // ==================== 4. رسم درع الحكمة وتصلب الشوكولاتة ====================
            const shieldX = 1240;
            const shieldY = 540;
            const isShieldVerified = time >= 5.8;

            const shieldEntrance = clamp01((time - 0.4) / 1.2);
            const shieldScale = 0.88 + 0.12 * easeOutBack(shieldEntrance);
            const shieldHover = Math.sin(time * 2.0) * 6;

            drawResilientBoundaryShield(ctx, shieldX, shieldY + shieldHover, shieldScale, shieldEntrance, isShieldVerified);

            // ==================== 5. كروت الحكمة والوعي النفسي جهة اليسار ====================
            // كارت 1: الحفاظ على الحلاوة واللطف
            if (time >= 0.8) {
                const c1P = clamp01((time - 0.8) / 0.8);
                ctx.save();
                ctx.translate(520, 280);
                const s1 = 0.88 + 0.12 * easeOutBack(c1P);
                ctx.scale(s1, s1);
                ctx.globalAlpha = c1P;

                ctx.beginPath();
                ctx.roundRect(-260, -60, 520, 120, 20);
                ctx.fillStyle = "rgba(255, 255, 255, 0.95)";
                ctx.shadowColor = "rgba(10, 15, 29, 0.08)";
                ctx.shadowBlur = 25;
                ctx.fill();

                ctx.shadowColor = "transparent";
                ctx.strokeStyle = "#f59e0b";
                ctx.lineWidth = 1.8;
                ctx.stroke();

                ctx.font = "800 20px 'IBM Plex Sans Arabic', sans-serif";
                ctx.fillStyle = "#1c0d06";
                ctx.textAlign = "right";
                ctx.fillText("الحل مش إنك تفقد حلاوتك 🍫", 230, -15);

                ctx.font = "500 14px 'IBM Plex Sans Arabic', sans-serif";
                ctx.fillStyle = "#64748b";
                ctx.fillText("اللطف قيمة راقية، والمشكلة ليست في طيبة القلب", 230, 20);
                ctx.restore();
            }

            // كارت 2: بناء الحدود الصلبة
            if (time >= 3.0) {
                const c2P = clamp01((time - 3.0) / 0.8);
                ctx.save();
                ctx.translate(520, 440);
                const s2 = 0.88 + 0.12 * easeOutBack(c2P);
                ctx.scale(s2, s2);
                ctx.globalAlpha = c2P;

                ctx.beginPath();
                ctx.roundRect(-260, -60, 520, 120, 20);
                ctx.fillStyle = "rgba(255, 255, 255, 0.95)";
                ctx.shadowColor = "rgba(10, 15, 29, 0.08)";
                ctx.shadowBlur = 25;
                ctx.fill();

                ctx.shadowColor = "transparent";
                ctx.strokeStyle = "#0284c7";
                ctx.lineWidth = 1.8;
                ctx.stroke();

                ctx.font = "800 20px 'IBM Plex Sans Arabic', sans-serif";
                ctx.fillStyle = "#0284c7";
                ctx.textAlign = "right";
                ctx.fillText("بل إنك تبني حدود صلبة تحميك 🛡️", 230, -15);

                ctx.font = "500 14px 'IBM Plex Sans Arabic', sans-serif";
                ctx.fillStyle = "#64748b";
                ctx.fillText("تعلم مهارة قول (لا) بوضوح واحترام للذات", 230, 20);
                ctx.restore();
            }

            // كارت 3: زر تأكيد الوعي والاستقلال النفسي
            const btnW = 520, btnH = 68;
            const btnX = 520, btnY = 600;

            if (time >= 4.2) {
                const btnP = clamp01((time - 4.2) / 0.7);
                let btnScale = 0.88 + 0.12 * easeOutBack(btnP);
                if (time >= 5.5 && time < 6.2) {
                    const pressP = (time - 5.5) / 0.7;
                    btnScale = pressP < 0.35 ? 0.94 : 1.0 + Math.sin(pressP * Math.PI) * 0.03;
                }

                ctx.save();
                ctx.translate(btnX, btnY);
                ctx.scale(btnScale, btnScale);
                ctx.globalAlpha = btnP;

                const btnGrad = ctx.createLinearGradient(-btnW / 2, 0, btnW / 2, 0);
                if (isShieldVerified) {
                    btnGrad.addColorStop(0, "#059669");
                    btnGrad.addColorStop(1, "#10b981");
                } else {
                    btnGrad.addColorStop(0, "#d97706");
                    btnGrad.addColorStop(1, "#f59e0b");
                }

                ctx.shadowColor = isShieldVerified ? "rgba(16, 185, 129, 0.4)" : "rgba(245, 158, 11, 0.35)";
                ctx.shadowBlur = 24;
                ctx.shadowOffsetY = 8;

                ctx.beginPath();
                ctx.roundRect(-btnW / 2, -btnH / 2, btnW, btnH, 34);
                ctx.fillStyle = btnGrad;
                ctx.fill();

                ctx.shadowColor = "transparent";
                ctx.strokeStyle = "rgba(255, 255, 255, 0.4)";
                ctx.lineWidth = 1.6;
                ctx.stroke();

                ctx.font = "900 19px 'IBM Plex Sans Arabic', sans-serif";
                ctx.fillStyle = "#ffffff";
                ctx.textAlign = "center";
                ctx.textBaseline = "middle";
                const bText = isShieldVerified ? "تم تفعيل الحدود والوعي النفسي ✓" : "تفعيل الحدود وحماية الشخصية  →";
                ctx.fillText(bText, 0, 0);

                ctx.restore();
            }

            // ==================== 6. حركة يد الماوس SVG المعتمدة ====================
            const targetBtnPos = { x: btnX, y: btnY };
            let handX = targetBtnPos.x + 280;
            let handY = targetBtnPos.y + 200;
            let handDip = 0;

            if (time < 4.0) {
                handX = targetBtnPos.x + 280;
                handY = targetBtnPos.y + 200;
            } else if (time < 5.4) {
                const p = easeInOutCubic((time - 4.0) / 1.4);
                handX = targetBtnPos.x + 280 - p * 280;
                handY = targetBtnPos.y + 200 - p * 200 - Math.sin(p * Math.PI) * 40;
            } else if (time < 6.0) {
                handX = targetBtnPos.x;
                handY = targetBtnPos.y;
                handDip = Math.sin(((time - 5.4) / 0.6) * Math.PI) * 10;
            } else {
                handX = targetBtnPos.x + Math.sin(time * 2) * 5;
                handY = targetBtnPos.y + 15 + Math.cos(time * 2) * 4;
            }

            if (handImage && time >= 3.8) {
                ctx.save();
                const drawSize = 115;
                const hotspotOffsetX = (12.5 / 32) * drawSize;
                const hotspotOffsetY = (7.5 / 32) * drawSize;

                ctx.translate(handX, handY + handDip);

                ctx.shadowColor = "rgba(10, 15, 29, 0.22)";
                ctx.shadowBlur = 18;
                ctx.shadowOffsetY = 8;

                ctx.drawImage(handImage, -hotspotOffsetX, -hotspotOffsetY, drawSize, drawSize);
                ctx.restore();
            }

            // موجة الصدمة عند نقر الزر وتفعيل الدرع
            if (time >= 5.8 && time < 7.2) {
                const rip = (time - 5.8) / 1.4;
                ctx.beginPath();
                ctx.arc(shieldX, shieldY, 80 + rip * 220, 0, Math.PI * 2);
                ctx.strokeStyle = "#10b981";
                ctx.lineWidth = 3;
                ctx.globalAlpha = 1 - rip;
                ctx.stroke();
                ctx.globalAlpha = 1.0;
            }

            // ==================== 7. الشارة الختامية الذهبية ====================
            // "خليك واعي... ومتخليش رضا الناس يدوّب شخصيتك!"
            if (time >= 6.5) {
                const outroP = clamp01((time - 6.5) / 0.8);
                ctx.save();
                ctx.translate(CONFIG.width / 2, 100);
                const oScale = 0.9 + 0.1 * easeOutBack(outroP);
                ctx.scale(oScale, oScale);
                ctx.globalAlpha = outroP;

                const outW = 620, outH = 54;
                ctx.beginPath();
                ctx.roundRect(-outW / 2, -outH / 2, outW, outH, 27);
                ctx.fillStyle = "#2d160b";
                ctx.fill();
                ctx.strokeStyle = "#10b981";
                ctx.lineWidth = 2;
                ctx.stroke();

                ctx.font = "900 20px 'IBM Plex Sans Arabic', sans-serif";
                ctx.fillStyle = "#fef08a";
                ctx.textAlign = "center";
                ctx.textBaseline = "middle";
                ctx.fillText("خَلِّيكْ وَاعِي.. وَمَتْخَلِّيشْ رِضَا النَّاسْ يْدَوِّبْ شَخْصِيَّتَكْ ✨", 0, 0);
                ctx.restore();
            }

            ctx.restore(); // استعادة الكاميرا

            // وميض الدخول الكهرماني المستلم من المشهد 2 في الفريم 0.0
            if (initialEntryFlash > 0.01) {
                ctx.fillStyle = `rgba(234, 88, 12, ${initialEntryFlash * 0.9})`;
                ctx.fillRect(0, 0, CONFIG.width, CONFIG.height);
            }
        }

        // ============ ⚙️ الطبقة التقنية الثابتة — من هنا تحت ============
        const canvas = document.getElementById('videoCanvas');
        const ctx = canvas.getContext('2d', { willReadFrequently: true });
        const statusText = document.getElementById('status-text');
        const spinner = document.getElementById('spinner');

        let audioAudioEl = null;
        let sharedAudioCtx = null;
        let state = { currentTime: 0, isRendering: false, animationFrameId: null };

        window.renderStatus = 'loading';

        function logToConsole(msg, type = 'info') {
            const output = document.getElementById('console-output');
            const line = document.createElement('div');
            line.className = `log-line log-${type}`;
            line.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
            output.appendChild(line);
            output.scrollTop = output.scrollHeight;
        }

        function clamp01(val) { return Math.max(0, Math.min(1, val)); }

        function layoutArabicParagraph(text, font, maxWidth, wordGap, lineHeight, centerY) {
            ctx.font = font;
            const words = text.split(' ');
            const lines = [];
            let currentWords = [], currentWidth = 0;

            words.forEach(w => {
                const wordWidth = ctx.measureText(w).width;
                const testWidth = currentWidth + (currentWords.length > 0 ? wordGap : 0) + wordWidth;
                if (testWidth > maxWidth && currentWords.length > 0) {
                    lines.push({ words: currentWords, width: currentWidth });
                    currentWords = []; currentWidth = 0;
                }
                currentWords.push({ text: w, width: wordWidth });
                currentWidth += (currentWords.length > 1 ? wordGap : 0) + wordWidth;
            });
            if (currentWords.length) lines.push({ words: currentWords, width: currentWidth });

            const totalHeight = lines.length * lineHeight;
            const startY = centerY - totalHeight / 2 + lineHeight / 2;
            const flatWords = [];

            lines.forEach((line, li) => {
                const lineY = startY + li * lineHeight;
                let currentX = (CONFIG.width / 2) + (line.width / 2);
                line.words.forEach(w => {
                    const wx = currentX - w.width;
                    flatWords.push({ text: w.text, x: wx + w.width / 2, y: lineY });
                    currentX -= (w.width + wordGap);
                });
            });
            return flatWords;
        }

        function audioBufferToWavBlob(buffer) {
            const numOfChan = buffer.numberOfChannels;
            const length = buffer.length * numOfChan * 2 + 44;
            const out = new DataView(new ArrayBuffer(length));
            let channels = [], sample, offset = 0, pos = 0;

            function setUint16(data) { out.setUint16(pos, data, true); pos += 2; }
            function setUint32(data) { out.setUint32(pos, data, true); pos += 4; }

            setUint32(0x46464952); setUint32(length - 8); setUint32(0x45564157);
            setUint32(0x20746d66); setUint32(16); setUint16(1); setUint16(numOfChan);
            setUint32(buffer.sampleRate); setUint32(buffer.sampleRate * 2 * numOfChan);
            setUint16(numOfChan * 2); setUint16(16); setUint32(0x61746164);
            setUint32(length - pos - 4);

            for (let i = 0; i < buffer.numberOfChannels; i++) channels.push(buffer.getChannelData(i));

            while (offset < buffer.length) {
                for (let i = 0; i < numOfChan; i++) {
                    sample = Math.max(-1, Math.min(1, channels[i][offset]));
                    sample = (0.5 + sample < 0 ? sample * 32768 : sample * 32767) | 0;
                    out.setInt16(pos, sample, true);
                    pos += 2;
                }
                offset++;
            }

            return new Blob([out], { type: "audio/wav" });
        }

        function getSharedAudioContext() {
            if (!sharedAudioCtx) sharedAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
            return sharedAudioCtx;
        }

        async function fetchAndDecodeAudio(url) {
            if (!/^https:\/\//i.test(url)) throw new Error(`رابط صوت غير آمن: ${url}`);
            const res = await fetch(url);
            if (!res.ok) throw new Error(`فشل جلب الصوت: ${url}`);
            const arrayBuf = await res.arrayBuffer();
            if (arrayBuf.byteLength < 1024) throw new Error(`حجم الملف صغير جداً: ${url}`);
            return getSharedAudioContext().decodeAudioData(arrayBuf);
        }

        function concatenateAudioBuffers(buffers) {
            if (!buffers || buffers.length === 0) throw new Error("مفيش أي AudioBuffer لتلزيقه");
            const sampleRate = buffers[0].sampleRate;
            const channelsCount = buffers[0].numberOfChannels;
            const totalSamples = buffers.reduce((sum, b) => sum + b.length, 0);
            const combined = getSharedAudioContext().createBuffer(channelsCount, totalSamples, sampleRate);

            let sampleOffset = 0, timeOffset = 0.0;
            const segments = [];

            for (const buf of buffers) {
                for (let ch = 0; ch < channelsCount; ch++) {
                    combined.getChannelData(ch).set(buf.getChannelData(ch), sampleOffset);
                }
                const duration = buf.duration;
                segments.push({ start: timeOffset, end: timeOffset + duration, duration });
                sampleOffset += buf.length;
                timeOffset += duration;
            }
            return { buffer: combined, segments };
        }

        async function createBrollFrameSampler(url, options = {}) {
            const videoEl = document.createElement('video');
            videoEl.crossOrigin = 'anonymous'; videoEl.muted = true;
            videoEl.playsInline = true; videoEl.preload = 'auto'; videoEl.src = url;

            await new Promise((resolve, reject) => {
                videoEl.onloadeddata = resolve;
                videoEl.onerror = () => reject(new Error(`فشل تحميل فيديو B-roll: ${url}`));
            });

            const targetW = options.width || videoEl.videoWidth;
            const targetH = options.height || videoEl.videoHeight;
            const fit = options.fit || 'cover';
            const sampleCanvas = document.createElement('canvas');
            sampleCanvas.width = targetW; sampleCanvas.height = targetH;
            const sampleCtx = sampleCanvas.getContext('2d');

            sampleCtx.drawImage(videoEl, 0, 0, 1, 1);
            let corsOk = true;
            try { sampleCtx.getImageData(0, 0, 1, 1); } catch (e) { corsOk = false; }

            if (!corsOk && options.posterFallbackUrl) {
                const posterImg = new Image(); posterImg.crossOrigin = 'anonymous';
                await new Promise((resolve, reject) => {
                    posterImg.onload = resolve;
                    posterImg.onerror = () => reject(new Error(`فشل تحميل صورة fallback: ${options.posterFallbackUrl}`));
                    posterImg.src = options.posterFallbackUrl;
                });
                return {
                    videoEl: null, isFallbackImage: true,
                    async getFrameAt(time) {
                        const zoom = 1.0 + Math.min(time / 10, 1) * 0.06;
                        const iw = posterImg.naturalWidth, ih = posterImg.naturalHeight;
                        const scale = Math.max(targetW / iw, targetH / ih) * zoom;
                        const dw = iw * scale, dh = ih * scale;
                        const dx = (targetW - dw) / 2, dy = (targetH - dh) / 2;
                        sampleCtx.clearRect(0, 0, targetW, targetH);
                        sampleCtx.drawImage(posterImg, dx, dy, dw, dh);
                        return sampleCanvas;
                    }
                };
            }

            if (!corsOk) throw new Error(`فيديو B-roll لا يدعم CORS: ${url}`);
            const useFrameCallback = typeof videoEl.requestVideoFrameCallback === 'function';

            return {
                videoEl,
                async getFrameAt(time) {
                    const seekTime = Math.min(Math.max(time, 0), Math.max(videoEl.duration - 0.01, 0));
                    await new Promise((resolve, reject) => {
                        const timeoutId = setTimeout(() => reject(new Error(`تأخر الفريم عند ${seekTime}s: ${url}`)), 5000);
                        if (useFrameCallback) {
                            videoEl.requestVideoFrameCallback(() => { clearTimeout(timeoutId); resolve(); });
                        } else {
                            videoEl.onseeked = () => { clearTimeout(timeoutId); resolve(); };
                        }
                        videoEl.currentTime = seekTime;
                    });

                    const vw = videoEl.videoWidth, vh = videoEl.videoHeight;
                    const scale = fit === 'contain' ? Math.min(targetW / vw, targetH / vh) : Math.max(targetW / vw, targetH / vh);
                    const dw = vw * scale, dh = vh * scale;
                    const dx = (targetW - dw) / 2, dy = (targetH - dh) / 2;

                    sampleCtx.clearRect(0, 0, targetW, targetH);
                    sampleCtx.drawImage(videoEl, dx, dy, dw, dh);
                    return sampleCanvas;
                }
            };
        }

        function startPreviewLoop() {
            if (state.animationFrameId) cancelAnimationFrame(state.animationFrameId);
            if (audioAudioEl) {
                audioAudioEl.currentTime = 0;
                audioAudioEl.play().catch(e => logToConsole("تنبيه الصوت: " + e.message, 'warn'));
            }

            const startTime = performance.now();
            async function loop(now) {
                if (state.isRendering) return;
                const elapsed = (now - startTime) / 1000;
                const currTime = audioAudioEl ? audioAudioEl.currentTime : (elapsed % CONFIG.duration);
                state.currentTime = currTime;
                await drawSceneAtTime(currTime);

                if (currTime < CONFIG.duration) {
                    state.animationFrameId = requestAnimationFrame(loop);
                } else {
                    statusText.textContent = "جاهز للعرض والتصدير ✓";
                    spinner.style.display = 'none';
                }
            }
            state.animationFrameId = requestAnimationFrame(loop);
        }

        const OFOQ_FRAME_FORMAT = 'image/png';
        window.__ofoqTotalFrames = 0;
        window.__ofoqFps = 0;
        window.__ofoqOutputFilename = '';
        window.__ofoqAudioWavBase64 = null;

        async function __ofoqGetFrameBatch(startFrame, count) {
            const frames = [];
            for (let i = 0; i < count; i++) {
                const frameIndex = startFrame + i;
                if (frameIndex >= window.__ofoqTotalFrames) break;
                const timestamp = frameIndex / window.__ofoqFps;
                await drawSceneAtTime(timestamp);
                const dataUrl = canvas.toDataURL(OFOQ_FRAME_FORMAT);
                frames.push(dataUrl.substring(dataUrl.indexOf(',') + 1));
            }
            return frames;
        }
        window.__ofoqGetFrameBatch = __ofoqGetFrameBatch;

        function arrayBufferToBase64(buffer) {
            let binary = '';
            const bytes = new Uint8Array(buffer);
            const chunkSize = 0x8000;
            for (let i = 0; i < bytes.length; i += chunkSize) {
                binary += String.fromCharCode.apply(null, bytes.subarray(i, i + chunkSize));
            }
            return btoa(binary);
        }

        document.getElementById('btn-replay').addEventListener('click', () => {
            statusText.textContent = "جاري عرض المعاينة...";
            spinner.style.display = 'inline-block';
            startPreviewLoop();
        });

        document.getElementById('btn-toggle-console').addEventListener('click', () => {
            const modal = document.getElementById('console-modal');
            modal.style.display = modal.style.display === 'flex' ? 'none' : 'flex';
        });

        document.getElementById('btn-close-console').addEventListener('click', () => {
            document.getElementById('console-modal').style.display = 'none';
        });

        document.getElementById('btn-render-start').addEventListener('click', () => {
            logToConsole("التصدير الفعلي يتم عبر render-runner.js (Node + ffmpeg).", 'warn');
        });

        async function init() {
            try {
                await prepareIdentity();
                canvas.width = CONFIG.width;
                canvas.height = CONFIG.height;
                window.__ofoqFps = CONFIG.fps;
                window.__ofoqTotalFrames = Math.ceil(CONFIG.duration * CONFIG.fps);
                window.__ofoqOutputFilename = `${OUTPUT_FILENAME}.mp4`;

                if (audioBuffer) {
                    const wavBlob = audioBufferToWavBlob(audioBuffer);
                    audioAudioEl = new Audio(URL.createObjectURL(wavBlob));
                    window.__ofoqAudioWavBase64 = arrayBufferToBase64(await wavBlob.arrayBuffer());
                }

                statusText.textContent = "جاهز للعرض والتصدير ✓";
                spinner.style.display = 'none';
                window.renderStatus = 'ready';
                await drawSceneAtTime(0);
            } catch (err) {
                logToConsole("خطأ أثناء التهيئة: " + err.message, 'error');
                statusText.textContent = "حدث خطأ أثناء التحميل";
                window.__renderError = err.message;
                window.renderStatus = 'error';
            }
        }
        window.addEventListener('load', init);
    </script>
