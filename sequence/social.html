<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Penta Master Sales Simulation - Square 1:1 Glass Edition</title>

    <!-- FONT IMPORTS (IBM PLEX SANS ARABIC & PLUS JAKARTA SANS) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@500;600;700;800;900&display=swap" rel="stylesheet">

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body {
            background-color: #0c0a09; color: #1c1917;
            font-family: 'IBM Plex Sans Arabic', 'Plus Jakarta Sans', sans-serif;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            min-height: 100vh; min-height: 100dvh; overflow: hidden; padding: 10px;
        }
        /* إطار العرض المربع 1:1 المتجاوب تلقائياً مع كافة مقاسات الشاشات */
        #viewport {
            position: relative;
            max-height: 86vh;
            max-width: 94vw;
            width: min(94vw, 86vh);
            height: min(94vw, 86vh);
            aspect-ratio: 1 / 1;
            background: #f5f5f5;
            box-shadow: 0 32px 85px rgba(0, 0, 0, 0.65), 0 0 1px 1px rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        canvas { width: 100%; height: 100%; object-fit: contain; display: block; }
        #hud {
            position: absolute; top: 16px; right: 16px;
            background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(16px);
            color: #1c1917; padding: 6px 14px; border-radius: 30px;
            font-size: 12px; font-weight: 700; display: flex; align-items: center; gap: 8px;
            border: 1px solid #e5e5e5; z-index: 10;
        }
        .spinner {
            width: 12px; height: 12px; border: 2px solid #e5e5e5;
            border-top: 2px solid #1c1917; border-radius: 50%; animation: spin 0.8s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        #controls-overlay {
            position: absolute; bottom: 16px; left: 50%; transform: translateX(-50%);
            display: flex; gap: 8px; z-index: 10; background: rgba(255, 255, 255, 0.95);
            padding: 6px 12px; border-radius: 40px; backdrop-filter: blur(16px);
            border: 1px solid #e5e5e5;
        }
        .btn {
            font-family: inherit; font-size: 12px; font-weight: 700; padding: 6px 14px;
            border-radius: 20px; border: none; cursor: pointer; display: flex;
            align-items: center; gap: 6px; transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .btn-preview { background: #f5f5f5; color: #1c1917; border: 1px solid #e5e5e5; }
        .btn-preview:hover { background: #e5e5e5; }
        .btn-render { background: #1c1917; color: #ffffff; }
        .btn-render:hover { background: #292524; }
        #console-modal {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 680px; max-width: 92vw; height: 400px; background: #ffffff;
            border: 1px solid #e5e5e5; border-radius: 14px; box-shadow: 0 30px 80px rgba(0,0,0,0.15);
            z-index: 100; display: none; flex-direction: column; overflow: hidden;
        }
        #console-header {
            background: #fafafa; padding: 12px 18px; display: flex; color: #1c1917;
            justify-content: space-between; align-items: center; font-size: 13px; font-weight: bold;
            border-bottom: 1px solid #e5e5e5;
        }
        #console-output {
            flex: 1; padding: 14px; overflow-y: auto; font-family: monospace;
            font-size: 12px; color: #44403c; background: #ffffff; line-height: 1.6;
        }
        .log-line { margin-bottom: 4px; }
        .log-info { color: #1c1917; }
        .log-warn { color: #78716c; }
        .log-error { color: #b91c1c; }
    </style>
</head>
<body>
    <div id="viewport">
        <canvas id="videoCanvas"></canvas>
        <div id="hud"><div class="spinner" id="spinner"></div><span id="status-text">جاري تشغيل المنظومة الخماسية...</span></div>
        <div id="controls-overlay">
            <button class="btn btn-preview" id="btn-replay">إعادة العرض</button>
            <button class="btn btn-toggle-console" id="btn-toggle-console">السجل البرمجي</button>
            <button class="btn btn-render" id="btn-render-start">تصدير المشهد</button>
        </div>
    </div>

    <div id="console-modal">
        <div id="console-header">
            <span>سجل النظام</span>
            <button class="btn btn-preview" id="btn-close-console" style="color:#fff; background:#1c1917; border:none; padding:4px 14px;">إغلاق</button>
        </div>
        <div id="console-output"></div>
    </div>

    <script type="module">
        // ============ IDENTITY LAYER (5-APP MASTER SQUARE 1:1 SIMULATION) ============
        const CONFIG = {
            fps: 30,
            width: 1080,
            height: 1080,
            duration: 30.0
        };
        const OUTPUT_FILENAME = 'penta_master_sales_square_1x1';
        let audioBuffer = null;

        function clamp(v, min = 0, max = 1) { return Math.max(min, Math.min(max, v)); }
        
        function springOvershoot(t, tension = 1.85) {
            t = clamp(t);
            return 1 + (tension + 1) * Math.pow(t - 1, 3) + tension * Math.pow(t - 1, 2);
        }

        function easeInOutExpo(t) {
            t = clamp(t);
            if (t === 0) return 0;
            if (t === 1) return 1;
            return t < 0.5 ? Math.pow(2, 20 * t - 10) / 2 : (2 - Math.pow(2, -20 * t + 10)) / 2;
        }

        function easeInOutCubic(t) { 
            t = clamp(t);
            return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; 
        }

        // ============ ICONIFY NATIVE LOGOS LOADER ============
        const appLogos = {
            whatsapp: null,
            messenger: null,
            instagram: null,
            gmail: null,
            telegram: null
        };

        const ICONIFY_DATA_URIS = {
            whatsapp: 'data:image/svg+xml;utf8,' + encodeURIComponent(`
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
                  <path fill="#25D366" d="M24 4C13 4 4 13 4 24c0 3.5 1 7 2.8 10L4 44l10.3-2.7c3 1.7 6.3 2.7 9.7 2.7 11 0 20-9 20-20S35 4 24 4z"/>
                  <path fill="#FFFFFF" d="M35.2 28.7c-.5-.3-2.9-1.4-3.4-1.6-.4-.2-.8-.3-1.1.3-.3.5-1.2 1.6-1.5 1.9-.3.3-.6.4-1.1.1-.5-.3-2.2-.8-4.2-2.6-1.6-1.4-2.6-3.1-2.9-3.7-.3-.5 0-.8.2-1.1.2-.2.5-.6.8-.9.3-.3.4-.5.6-.8.2-.4.1-.7 0-1-.1-.3-1.1-2.7-1.5-3.7-.4-1-.8-.8-1.1-.8h-1c-.3 0-.9.1-1.4.7-.5.5-1.9 1.8-1.9 4.5 0 2.6 1.9 5.2 2.2 5.6.3.4 3.8 5.8 9.2 8.1 1.3.6 2.3.9 3.1 1.1 1.3.4 2.5.4 3.4.2 1-.2 2.9-1.2 3.3-2.4.4-1.1.4-2.1.3-2.3-.1-.2-.5-.4-1-.7z"/>
                </svg>
            `),
            messenger: 'data:image/svg+xml;utf8,' + encodeURIComponent(`
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
                  <path fill="url(#msGrad)" d="M24 4C12.9 4 4 12.3 4 22.7c0 5.8 2.8 11 7.2 14.5V44l6.5-3.6c2 .5 4.1.8 6.3.8 11.1 0 20-8.3 20-18.5S35.1 4 24 4z"/>
                  <defs>
                    <linearGradient id="msGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                      <stop offset="0%" stop-color="#00B2FF"/>
                      <stop offset="50%" stop-color="#006AFF"/>
                      <stop offset="100%" stop-color="#FF5280"/>
                    </linearGradient>
                  </defs>
                  <path fill="#ffffff" d="M14 26.5l6.5-6.8 5 5 7.5-6.7-6.5 6.8-5-5z"/>
                </svg>
            `),
            instagram: 'data:image/svg+xml;utf8,' + encodeURIComponent(`
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
                  <defs>
                    <radialGradient id="skillIconsInstagram0" cx="19.38%" cy="101.3%" r="108.6%" fx="19.38%" fy="101.3%">
                      <stop offset="0%" stop-color="#fd5"/>
                      <stop offset="10%" stop-color="#fd5"/>
                      <stop offset="50%" stop-color="#ff543e"/>
                      <stop offset="100%" stop-color="#c837ab"/>
                    </radialGradient>
                  </defs>
                  <rect width="256" height="256" rx="60" fill="url(#skillIconsInstagram0)"/>
                  <path fill="#fff" d="M128 80a48 48 0 1 0 48 48a48.05 48.05 0 0 0-48-48m0 76a28 28 0 1 1 28-28a28 28 0 0 1-28 28m47.2-79.6a11.2 11.2 0 1 1-11.2-11.2a11.2 11.2 0 0 1 11.2 11.2M188 52H68a44.05 44.05 0 0 0-44 44v120a44.05 44.05 0 0 0 44 44h120a44.05 44.05 0 0 0 44-44V96a44.05 44.05 0 0 0-44-44m24 164a24 24 0 0 1-24 24H68a24 24 0 0 1-24-24V96a24 24 0 0 1 24-24h120a24 24 0 0 1 24 24Z"/>
                </svg>
            `),
            gmail: 'data:image/svg+xml;utf8,' + encodeURIComponent(`
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                  <path fill="#4285F4" d="M2 6v12a2 2 0 0 0 2 2h2V10.5L2 7.5z"/>
                  <path fill="#34A853" d="M22 6v12a2 2 0 0 1-2 2h-2V10.5L22 7.5z"/>
                  <path fill="#EA4335" d="M18 10.5L12 15L6 10.5V6a2 2 0 0 1 3.2-1.6L12 6.5l2.8-2.1A2 2 0 0 1 18 6v4.5z"/>
                  <path fill="#FBBC04" d="M18 6L22 7.5V6a2 2 0 0 0-3.2-1.6z"/>
                  <path fill="#C5221F" d="M6 6L2 7.5V6a2 2 0 0 1 3.2-1.6z"/>
                </svg>
            `),
            telegram: 'data:image/svg+xml;utf8,' + encodeURIComponent(`
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
                  <circle cx="24" cy="24" r="20" fill="#229ED9"/>
                  <path fill="#ffffff" d="M33.8 14.5c.3-.9-.6-1.5-1.4-1.2L11.5 21.2c-.9.4-.9 1.4-.1 1.7l5.4 1.7 12.5-7.9c.6-.4 1.1-.2.7.2L19.9 26.2v4.8c0 .7.8 1.1 1.3.6l3.6-3.5 5.5 4.1c.8.6 1.8.2 2-.8l3.5-16.9z"/>
                </svg>
            `)
        };

        function fetchIconify(key, apiName) {
            return new Promise((resolve) => {
                const img = new Image();
                img.crossOrigin = 'anonymous';
                img.onload = () => resolve(img);
                img.onerror = () => {
                    const fallback = new Image();
                    fallback.onload = () => resolve(fallback);
                    fallback.src = ICONIFY_DATA_URIS[key];
                };
                img.src = `https://api.iconify.design/${apiName}.svg`;
            });
        }

        // Precision Vectors
        const SVG_PATHS = {
            phone: new Path2D("M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"),
            video: new Path2D("M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M4 6h11a2 2 0 012 2v8a2 2 0 01-2 2H4a2 2 0 01-2-2V8a2 2 0 012-2z"),
            info: new Path2D("M12 22C6.477 22 2 17.523 2 12S6.477 2 12 2s10 4.477 10 10-4.477 10-10 10zm-1-11v6h2v-6h-2zm0-4v2h2V7h-2z"),
            chevronRight: new Path2D("M9 6l6 6-6 6"),
            wifi: new Path2D("M12 18a2 2 0 1 0 0-4 2 2 0 0 0 0 4zm-4.24-4.24a6 6 0 0 1 8.48 0M4.93 10.93a10 10 0 0 1 14.14 0"),
            trash: new Path2D("M3 6h18m-2 0v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"),
            star: new Path2D("M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"),
            threeDots: new Path2D("M12 5a1.5 1.5 0 1 0 0-3 1.5 1.5 0 0 0 0 3zm0 8.5a1.5 1.5 0 1 0 0-3 1.5 1.5 0 0 0 0 3zm0 8.5a1.5 1.5 0 1 0 0-3 1.5 1.5 0 0 0 0 3z"),
            replyAll: new Path2D("M7 10h8a5 5 0 0 1 5 5v2M3 10l4-4M3 10l4 4M7 6l4-4M7 14l4 4"),
            forward: new Path2D("M21 10H11a5 5 0 0 0-5 5v2m15-7l-4-4m4 4l-4 4"),
            snooze: new Path2D("M19 4H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2z M12 8v5l3 3")
        };

        function drawNativeSVG(ctx, path, x, y, size = 20, color = '#1f1f1f', lineWidth = 2.0, isFill = false) {
            ctx.save();
            ctx.translate(x, y);
            const scale = size / 24;
            ctx.scale(scale, scale);
            ctx.translate(-12, -12);
            
            if (isFill) {
                ctx.fillStyle = color;
                ctx.fill(path);
            } else {
                ctx.strokeStyle = color;
                ctx.lineWidth = lineWidth / scale;
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';
                ctx.stroke(path);
            }
            ctx.restore();
        }

        function drawNativeBattery(ctx, x, y, level = 0.85, col = '#000000') {
            ctx.save();
            ctx.strokeStyle = col;
            ctx.lineWidth = 1.6;
            ctx.strokeRect(x - 11, y - 5, 20, 10);
            ctx.fillStyle = col;
            ctx.fillRect(x + 9.5, y - 2.5, 2, 5);
            ctx.fillRect(x - 9, y - 3.5, 16 * level, 7);
            ctx.restore();
        }

        function drawDefaultUserAvatar(ctx, x, y, r = 22, bg = '#e2e8f0', fg = '#64748b') {
            ctx.save();
            ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2);
            ctx.fillStyle = bg; ctx.fill();
            ctx.fillStyle = fg;
            ctx.beginPath(); ctx.arc(x, y - r * 0.22, r * 0.38, 0, Math.PI * 2); ctx.fill();
            ctx.beginPath();
            ctx.arc(x, y + r * 1.02, r * 0.72, Math.PI * 1.15, Math.PI * 1.85);
            ctx.fill();
            ctx.restore();
        }

        const CustomSVGs = {
            doubleBlueTick(ctx, x, y) {
                ctx.save();
                ctx.strokeStyle = '#34B7F1'; ctx.lineWidth = 2.0; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
                ctx.beginPath(); ctx.moveTo(x - 7, y); ctx.lineTo(x - 3, y + 4.5); ctx.lineTo(x + 5, y - 4.5);
                ctx.stroke();
                ctx.beginPath(); ctx.moveTo(x - 1.5, y); ctx.lineTo(x + 3, y + 4.5); ctx.lineTo(x + 11, y - 4.5);
                ctx.stroke();
                ctx.restore();
            },
            heart(ctx, x, y, s = 8) {
                ctx.save();
                ctx.fillStyle = '#e1306c'; ctx.beginPath();
                ctx.moveTo(x, y + s*0.6);
                ctx.bezierCurveTo(x - s, y - s*0.2, x - s, y - s*0.9, x, y - s*0.5);
                ctx.bezierCurveTo(x + s, y - s*0.9, x + s, y - s*0.2, x, y + s*0.6);
                ctx.fill(); ctx.restore();
            }
        };

        function drawWhatsAppWallpaper(ctx, x, y, w, h) {
            ctx.save(); ctx.fillStyle = '#EFEAE2'; ctx.fillRect(x, y, w, h);
            ctx.strokeStyle = 'rgba(0, 0, 0, 0.038)'; ctx.lineWidth = 1.2; const spacing = 48;
            for (let px = x + 16; px < x + w; px += spacing) {
                for (let py = y + 16; py < y + h; py += spacing) {
                    ctx.beginPath();
                    if ((px + py) % 4 === 0) ctx.arc(px, py, 4, 0, Math.PI * 2);
                    else if ((px + py) % 3 === 0) ctx.roundRect(px - 4, py - 4, 8, 8, 2);
                    else { ctx.moveTo(px - 3, py); ctx.lineTo(px + 3, py); ctx.moveTo(px, py - 3); ctx.lineTo(px, py + 3); }
                    ctx.stroke();
                }
            }
            ctx.restore();
        }

        // Draw Official Native Splash Screen
        function drawNativeSplashScreen(ctx, phoneW, phoneH, topY, appLogoImg, logoScale, appNameText, subtext = "from Meta", isGmail = false) {
            ctx.save();
            ctx.fillStyle = "#ffffff";
            ctx.fillRect(-phoneW / 2, topY, phoneW, phoneH + 100);

            if (appLogoImg) {
                let logoW = 76 * logoScale;
                let logoH = isGmail ? (57 * logoScale) : logoW;
                ctx.drawImage(appLogoImg, -logoW / 2, topY + 360 - logoH / 2, logoW, logoH);
            }

            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            ctx.font = "600 13.5px 'Plus Jakarta Sans', sans-serif";
            ctx.fillStyle = "#8696a0";
            ctx.fillText(subtext, 0, topY + phoneH - 120);

            ctx.font = "800 17px 'Plus Jakarta Sans', sans-serif";
            ctx.fillStyle = isGmail ? "#EA4335" : (appNameText === "Telegram" ? "#229ED9" : "#1e293b");
            ctx.fillText(appNameText, 0, topY + phoneH - 95);
            ctx.restore();
        }

        async function prepareIdentity() {
            await document.fonts.ready;
            const [wa, ms, ig, gm, tg] = await Promise.all([
                fetchIconify('whatsapp', 'logos:whatsapp-icon'),
                fetchIconify('messenger', 'logos:messenger'),
                fetchIconify('instagram', 'skill-icons:instagram'),
                fetchIconify('gmail', 'logos:google-gmail'),
                fetchIconify('telegram', 'logos:telegram')
            ]);
            appLogos.whatsapp = wa;
            appLogos.messenger = ms;
            appLogos.instagram = ig;
            appLogos.gmail = gm;
            appLogos.telegram = tg;
        }

        // ============ MAIN RENDERING ENGINE (SQUARE 1:1) ============
        async function drawSceneAtTime(time) {
            ctx.clearRect(0, 0, CONFIG.width, CONFIG.height);

            // Clean Pure Studio Background #f5f5f5 (NO GRID)
            ctx.fillStyle = '#f5f5f5';
            ctx.fillRect(0, 0, CONFIG.width, CONFIG.height);

            // Ambient Center Studio Glow (Same as Scene 1)
            const centerGlow = ctx.createRadialGradient(
                CONFIG.width / 2, CONFIG.height / 2, 60,
                CONFIG.width / 2, CONFIG.height / 2, CONFIG.width * 0.85
            );
            centerGlow.addColorStop(0, '#ffffff');
            centerGlow.addColorStop(0.65, 'rgba(255, 255, 255, 0.6)');
            centerGlow.addColorStop(1, 'rgba(245, 245, 245, 0)');
            ctx.fillStyle = centerGlow;
            ctx.fillRect(0, 0, CONFIG.width, CONFIG.height);

            // ============ 5 PHONES IN SQUARE 1:1 CANVAS COORDINATES ============
            const phoneW = 540;
            const topY = 65;
            const phoneH = CONFIG.height - topY;

            // Spacing across deep X space (Center of canvas is 540)
            const devices = {
                wa: { x: 540 },   // 1. WhatsApp
                ms: { x: 1380 },  // 2. Messenger
                ig: { x: 2220 },  // 3. Instagram
                gm: { x: 3060 },  // 4. Gmail
                tg: { x: 3900 }   // 5. Telegram
            };

            // Seamless Macro Camera Gliding in Square Frame
            let camX = devices.wa.x;
            const camScale = 1.0;

            if (time < 6.0) {
                camX = devices.wa.x;
            } else if (time < 12.0) {
                const p = easeInOutExpo((time - 6.0) / 1.4);
                camX = devices.wa.x + (devices.ms.x - devices.wa.x) * p;
            } else if (time < 18.0) {
                const p = easeInOutExpo((time - 12.0) / 1.4);
                camX = devices.ms.x + (devices.ig.x - devices.ms.x) * p;
            } else if (time < 24.0) {
                const p = easeInOutExpo((time - 18.0) / 1.4);
                camX = devices.ig.x + (devices.gm.x - devices.ig.x) * p;
            } else {
                const p = easeInOutExpo((time - 24.0) / 1.4);
                camX = devices.gm.x + (devices.tg.x - devices.gm.x) * p;
            }

            const breath = Math.sin(time * 2.0) * 1.5;

            ctx.save();
            ctx.translate(CONFIG.width / 2, 0);
            ctx.scale(camScale, camScale);
            ctx.translate(-camX, breath);

            // ============ EXACT PURE GLASS SPECULAR PHONE BORDER (FROM SCENE 1) ============
            function drawPureGlassPhoneBody() {
                // Phone Body Solid Crisp White #ffffff (ZERO SHADOWS)
                ctx.beginPath();
                ctx.roundRect(-phoneW / 2, topY, phoneW, phoneH + 100, [56, 56, 0, 0]);
                ctx.fillStyle = '#ffffff';
                ctx.fill();

                // Exact Specular Gray Glass Stroke (#ffffff to #e5e5e5 to #ffffff)
                const edgeGrad = ctx.createLinearGradient(-phoneW / 2, topY, phoneW / 2, topY + 500);
                edgeGrad.addColorStop(0, '#ffffff');
                edgeGrad.addColorStop(0.35, '#e5e5e5');
                edgeGrad.addColorStop(0.7, '#d4d4d8');
                edgeGrad.addColorStop(1, '#ffffff');
                ctx.lineWidth = 4.0;
                ctx.strokeStyle = edgeGrad;
                ctx.stroke();

                // Inner Specular Rim Glint
                ctx.beginPath();
                ctx.roundRect(-phoneW / 2 + 1.2, topY + 1.2, phoneW - 2.4, phoneH + 100, [54, 54, 0, 0]);
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.95)';
                ctx.lineWidth = 1.0;
                ctx.stroke();
            }

            // =========================================================================
            // 1. iPHONE 1: WHATSAPP iOS (SALES CLOSING) [0.0s - 6.0s]
            // =========================================================================
            ctx.save();
            ctx.translate(devices.wa.x, 0);

            drawNativeSVG(ctx, SVG_PATHS.chevronRight, phoneW / 2 - 32, gmTopBarY, 20, '#1e293b', 2.4);

            drawNativeSVG(ctx, SVG_PATHS.snooze, -phoneW / 2 + 135, gmTopBarY, 18, '#444746', 1.8);
            drawNativeSVG(ctx, SVG_PATHS.trash, -phoneW / 2 + 90, gmTopBarY, 18, '#444746', 1.8);
            drawNativeSVG(ctx, SVG_PATHS.threeDots, -phoneW / 2 + 40, gmTopBarY, 18, '#444746', 1.8, true);

            ctx.strokeStyle = '#E0E3E7'; ctx.lineWidth = 0.8; ctx.beginPath(); ctx.moveTo(-phoneW / 2, topY + waHeaderH); ctx.lineTo(phoneW / 2, topY + waHeaderH); ctx.stroke();

            // Thread Scroll
            let gmScrollY = 0;
            if (time >= 21.0) {
                const p = easeInOutCubic(clamp((time - 21.0) / 2.5));
                gmScrollY = p * 175;
            }

            ctx.save();
            ctx.beginPath(); ctx.roundRect(-phoneW / 2, topY + waHeaderH + 1, phoneW, phoneH, 0); ctx.clip();
            ctx.translate(0, -gmScrollY);

            // Subject Header & B2B Tag
            const threadStartY = topY + waHeaderH + 24;
            ctx.textAlign = 'right'; ctx.font = "800 20.5px 'IBM Plex Sans Arabic'"; ctx.fillStyle = '#1f1f1f';
            ctx.fillText("استفسار بخصوص باقات أتمتة الـ CRM - مجموعة الأمل", phoneW / 2 - 24, threadStartY);
            drawNativeSVG(ctx, SVG_PATHS.star, -phoneW / 2 + 36, threadStartY - 6, 20, '#444746', 1.8);

            // B2B Tag Pill
            ctx.fillStyle = '#E8F0FE'; ctx.beginPath(); ctx.roundRect(phoneW / 2 - 145, threadStartY + 14, 120, 26, 6); ctx.fill();
            ctx.font = "700 12px 'IBM Plex Sans Arabic'"; ctx.fillStyle = '#1A73E8';
            ctx.textAlign = 'center'; ctx.fillText("استفسارات الشركات B2B", phoneW / 2 - 85, threadStartY + 31);

            // B2B EMAIL CARDS (CLEAN ZERO OVERLAP)
            const emailCardW = phoneW - 48;
            const cardStartX = -phoneW / 2 + 24;

            function drawCleanEmailCard(cardY, senderName, roleSubtitle, timeStr, lines, avatarBg, avatarFg, isAccepted = false) {
                const cardH = 55 + lines.length * 26 + 18;
                ctx.fillStyle = '#FFFFFF';
                ctx.beginPath(); ctx.roundRect(cardStartX, cardY, emailCardW, cardH, 14); ctx.fill();
                ctx.strokeStyle = isAccepted ? '#A7F3D0' : '#E0E3E7'; ctx.lineWidth = isAccepted ? 1.5 : 1; ctx.stroke();

                const avX = cardStartX + emailCardW - 28;
                const avY = cardY + 28;
                drawDefaultUserAvatar(ctx, avX, avY, 16, avatarBg, avatarFg);

                ctx.textAlign = 'right'; ctx.font = "800 15px 'IBM Plex Sans Arabic'"; ctx.fillStyle = '#1f1f1f';
                ctx.fillText(senderName, avX - 26, cardY + 20);

                ctx.font = "600 11.5px 'IBM Plex Sans Arabic'"; ctx.fillStyle = '#64748b';
                ctx.fillText(roleSubtitle, avX - 26, cardY + 38);

                ctx.textAlign = 'left'; ctx.font = "600 11.5px 'Plus Jakarta Sans'"; ctx.fillStyle = '#94a3b8';
                ctx.fillText(timeStr, cardStartX + 20, cardY + 22);

                ctx.strokeStyle = '#F1F5F9'; ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.moveTo(cardStartX + 18, cardY + 54);
                ctx.lineTo(cardStartX + emailCardW - 18, cardY + 54);
                ctx.stroke();

                ctx.textAlign = 'right'; ctx.font = "600 13px 'IBM Plex Sans Arabic'"; ctx.fillStyle = '#1e293b';
                lines.forEach((line, li) => {
                    ctx.fillText(line, cardStartX + emailCardW - 20, cardY + 76 + li * 25);
                });

                return cardH;
            }

            // 1. EMAIL 1: استفسار العميل
            let currentCardY = threadStartY + 55;
            const e1Prog = springOvershoot(clamp((time - 18.8) / 0.5), 1.8);
            if (e1Prog > 0) {
                ctx.save();
                ctx.translate(0, currentCardY);
                ctx.scale(e1Prog, e1Prog);
                ctx.translate(0, -currentCardY);

                const lines1 = [
                    "تحية طيبة، نود الاستفسار عن باقات أتمتة خدمة العملاء وإدارة الـ CRM",
                    "المتوافقة مع حجم شركتنا (فريق من 50 موظفاً). نرجو تزويدنا بالتفاصيل",
                    "الفنية والتكلفة التقديرية لبدء التعاقد السنوي."
                ];
                const h1 = drawCleanEmailCard(currentCardY, "أحمد فؤاد", "مدير العمليات (مجموعة الأمل)", "9:35 AM", lines1, '#e2e8f0', '#64748b');
                currentCardY += h1 + 14;
                ctx.restore();
            } else {
                currentCardY += 165;
            }

            // 2. EMAIL 2: رد مسؤول المبيعات
            const e2Prog = springOvershoot(clamp((time - 19.8) / 0.5), 1.8);
            if (e2Prog > 0) {
                ctx.save();
                ctx.translate(0, currentCardY);
                ctx.scale(e2Prog, e2Prog);
                ctx.translate(0, -currentCardY);

                const lines2 = [
                    "أهلاً بك أ. أحمد، يسعدنا تواصلكم! أرفقنا لحضرتكم العرض الفني والمالي المخصص",
                    "لشركتكم بخصم 25% للاشتراك السنوي وتدريب مجاني للفريق بالكامل.",
                    "📄 رابط توقيع العقد الإلكتروني المباشر: docu.saas/sign45"
                ];
                const h2 = drawCleanEmailCard(currentCardY, "م. رامي جمال", "مستشار الحلول والتعاقدات", "9:40 AM", lines2, '#dbeafe', '#2563eb');
                currentCardY += h2 + 14;
                ctx.restore();
            } else {
                currentCardY += 160;
            }

            // 3. EMAIL 3: توقيع الاتفاقية
            const e3Prog = springOvershoot(clamp((time - 20.8) / 0.5), 1.8);
            if (e3Prog > 0) {
                ctx.save();
                ctx.translate(0, currentCardY);
                ctx.scale(e3Prog, e3Prog);
                ctx.translate(0, -currentCardY);

                const lines3 = [
                    "عرض متكامل واحترافي يلبي احتياجاتنا تماماً. تم اعتماد العرض وتوقيع",
                    "الاتفاقية إلكترونياً، وسنقوم بتحويل الدفعة اليوم للبدء الفوري غداً!"
                ];
                const h3 = drawCleanEmailCard(currentCardY, "أحمد فؤاد (تم التوقيع 💰)", "مدير العمليات", "9:45 AM", lines3, '#dcfce7', '#15803d', true);
                currentCardY += h3 + 18;
                ctx.restore();
            } else {
                currentCardY += 140;
            }

            // Floating Reply Actions
            const fabY = currentCardY + 10;
            ctx.fillStyle = '#0B57D0'; ctx.beginPath(); ctx.roundRect(phoneW / 2 - 175, fabY, 150, 38, 19); ctx.fill();
            drawNativeSVG(ctx, SVG_PATHS.replyAll, phoneW / 2 - 45, fabY + 19, 18, '#ffffff', 2.0);
            ctx.textAlign = 'right'; ctx.textBaseline = 'middle'; ctx.font = "800 13px 'IBM Plex Sans Arabic'"; ctx.fillStyle = '#ffffff';
            ctx.fillText("الرد على الكل", phoneW / 2 - 68, fabY + 20);

            ctx.fillStyle = '#0B57D0'; ctx.beginPath(); ctx.roundRect(phoneW / 2 - 320, fabY, 135, 38, 19); ctx.fill();
            drawNativeSVG(ctx, SVG_PATHS.forward, phoneW / 2 - 200, fabY + 19, 18, '#ffffff', 2.0);
            ctx.fillText("إعادة توجيه", phoneW / 2 - 222, fabY + 20);

            ctx.restore();

            // GMAIL SPLASH SCREEN (18.0s - 19.6s)
            if (time >= 18.0 && time < 19.8) {
                const splashAlpha = time < 19.2 ? 1.0 : clamp(1.0 - (time - 19.2) / 0.45);
                ctx.save();
                ctx.globalAlpha = splashAlpha;
                const splashScale = springOvershoot(clamp((time - 18.4) / 0.6), 1.8);
                drawNativeSplashScreen(ctx, phoneW, phoneH, topY, appLogos.gmail, splashScale, "Google Workspace", "from Google", true);
                ctx.restore();
            }

            // Dynamic Island
            ctx.fillStyle = '#000000'; ctx.beginPath(); ctx.roundRect(-56, topY + 12, 112, 32, 16); ctx.fill();
            ctx.fillStyle = '#0a0a0c'; ctx.beginPath(); ctx.arc(-26, topY + 28, 5.5, 0, Math.PI * 2); ctx.fill();

            ctx.restore(); ctx.restore();

            // =========================================================================
            // 5. iPHONE 5: TELEGRAM iOS (B2B CHANNEL & BOT SALES CLOSING) [24.0s - 30.0s]
            // =========================================================================
            ctx.save();
            ctx.translate(devices.tg.x, 0);
            drawPureGlassPhoneBody();

            ctx.save();
            ctx.beginPath(); ctx.roundRect(-phoneW / 2 + 6, topY + 6, phoneW - 12, phoneH + 100, [50, 50, 0, 0]); ctx.clip();
            
            // Telegram Wallpaper
            ctx.fillStyle = '#d5e2ed';
            ctx.fillRect(-phoneW / 2, topY, phoneW, phoneH + 50);

            // Telegram Header Bar
            const tgHeaderH = 120;
            ctx.fillStyle = '#ffffff'; ctx.fillRect(-phoneW / 2, topY, phoneW, tgHeaderH);
            ctx.strokeStyle = '#c8d6e5'; ctx.lineWidth = 1.0; ctx.beginPath(); ctx.moveTo(-phoneW / 2, topY + tgHeaderH); ctx.lineTo(phoneW / 2, topY + tgHeaderH); ctx.stroke();

            // Status Bar
            ctx.font = "700 14px 'Plus Jakarta Sans'"; ctx.fillStyle = '#0a0f1d';
            ctx.textAlign = 'right'; ctx.fillText("10:15", phoneW / 2 - 36, topY + 34);
            ctx.textAlign = 'left'; ctx.fillText("5G", -phoneW / 2 + 36, topY + 34);
            drawNativeSVG(ctx, SVG_PATHS.wifi, -phoneW / 2 + 64, topY + 31, 14, '#0a0f1d', 1.8);
            drawNativeBattery(ctx, -phoneW / 2 + 96, topY + 31, 0.90, '#0a0f1d');

            const tgHY = topY + 84;
            drawNativeSVG(ctx, SVG_PATHS.chevronRight, phoneW / 2 - 32, tgHY, 20, '#229ED9', 2.6);

            const avX5 = phoneW / 2 - 96;
            drawDefaultUserAvatar(ctx, avX5, tgHY, 24, '#e0f2fe', '#0284c7');

            ctx.textAlign = 'right'; ctx.font = "800 18px 'IBM Plex Sans Arabic'"; ctx.fillStyle = '#0a0f1d';
            ctx.fillText("عميل تيليجرام (ربط القناة)", phoneW / 2 - 136, tgHY - 6);
            ctx.font = "500 13px 'IBM Plex Sans Arabic'"; ctx.fillStyle = '#229ED9';
            ctx.fillText("متصل الآن", phoneW / 2 - 136, tgHY + 14);

            drawNativeSVG(ctx, SVG_PATHS.phone, -phoneW / 2 + 82, tgHY, 20, '#229ED9', 2.2);
            drawNativeSVG(ctx, SVG_PATHS.threeDots, -phoneW / 2 + 38, tgHY, 18, '#229ED9', 1.8, true);

            // Telegram Chat Feed
            const tgFeedY = topY + tgHeaderH + 24;
            ctx.fillStyle = 'rgba(255, 255, 255, 0.85)'; ctx.beginPath(); ctx.roundRect(-36, tgFeedY, 72, 24, 12); ctx.fill();
            ctx.font = "600 12px 'IBM Plex Sans Arabic'"; ctx.fillStyle = '#64748b'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText("اليوم", 0, tgFeedY + 12);

            // 1. Telegram Message 1
            const tgM1 = springOvershoot(clamp((time - 25.4) / 0.5), 1.8);
            if (tgM1 > 0) {
                ctx.save(); const bW = 360, bH = 80;
                ctx.translate(phoneW / 2 - 20 - bW, tgFeedY + 45); ctx.scale(tgM1, tgM1);
                ctx.fillStyle = '#FFFFFF'; ctx.beginPath(); ctx.roundRect(0, 0, bW, bH, [16, 4, 16, 16]); ctx.fill();
                ctx.textAlign = 'right'; ctx.textBaseline = 'top'; ctx.font = "600 15px 'IBM Plex Sans Arabic'"; ctx.fillStyle = '#000000';
                ctx.fillText("السلام عليكم، مهتم بالانضمام للباقة الخاصة", bW - 16, 12);
                ctx.fillText("بالقنوات وإدارة المبيعات الآلية لشركتنا.", bW - 16, 34);
                ctx.font = "500 10.5px 'Plus Jakarta Sans'"; ctx.fillStyle = '#8E8E93'; ctx.textAlign = 'left'; ctx.fillText("10:15 ص", 16, bH - 20);
                ctx.restore();
            }

            // 2. Telegram Message 2
            const tgM2 = springOvershoot(clamp((time - 26.2) / 0.5), 1.8);
            if (tgM2 > 0) {
                ctx.save(); ctx.translate(-phoneW / 2 + 20, tgFeedY + 140); ctx.scale(tgM2, tgM2);
                const b1W = 350, b1H = 62; ctx.fillStyle = '#EEFFDE'; ctx.beginPath(); ctx.roundRect(0, 0, b1W, b1H, [4, 16, 16, 16]); ctx.fill();
                ctx.textAlign = 'right'; ctx.textBaseline = 'middle'; ctx.font = "600 15px 'IBM Plex Sans Arabic'"; ctx.fillStyle = '#000000';
                ctx.fillText("وعليكم السلام ورحمة الله! ⚡ أهلاً بك، متاح", b1W - 14, 20);
                ctx.fillText("تفعيل البوت الفوري لقناتك مع لوحة تحكم كاملة.", b1W - 14, 42);
                ctx.font = "500 10.5px 'Plus Jakarta Sans'"; ctx.fillStyle = '#8E8E93'; ctx.textAlign = 'left'; ctx.fillText("10:15 ص", 24, 48);
                CustomSVGs.doubleBlueTick(ctx, 12, 48);
                ctx.restore();
            }

            // 3. Telegram Message 3
            const tgM3 = springOvershoot(clamp((time - 27.0) / 0.5), 1.8);
            if (tgM3 > 0) {
                ctx.save(); ctx.translate(-phoneW / 2 + 20, tgFeedY + 215); ctx.scale(tgM3, tgM3);
                const b2W = 320, b2H = 40; ctx.fillStyle = '#EEFFDE'; ctx.beginPath(); ctx.roundRect(0, 0, b2W, b2H, 16); ctx.fill();
                ctx.fillStyle = '#000000'; ctx.textAlign = 'right'; ctx.font = "700 14px 'IBM Plex Sans Arabic'";
                ctx.fillText("🚀 كود التفعيل المباشر: TG-VIP2026", b2W - 14, 20);
                ctx.fillStyle = '#8E8E93'; ctx.textAlign = 'left'; ctx.fillText("10:16 ص", 24, 24);
                CustomSVGs.doubleBlueTick(ctx, 12, 24);
                ctx.restore();
            }

            // 4. Telegram Message 4
            const tgM4 = springOvershoot(clamp((time - 27.8) / 0.5), 1.8);
            if (tgM4 > 0) {
                ctx.save(); const bW = 310, bH = 60;
                ctx.translate(phoneW / 2 - 20 - bW, tgFeedY + 270); ctx.scale(tgM4, tgM4);
                ctx.fillStyle = '#FFFFFF'; ctx.beginPath(); ctx.roundRect(0, 0, bW, bH, [16, 4, 16, 16]); ctx.fill();
                ctx.textAlign = 'right'; ctx.textBaseline = 'top'; ctx.font = "600 15px 'IBM Plex Sans Arabic'"; ctx.fillStyle = '#000000';
                ctx.fillText("تم ربط القناة بنجاح! مذهل،", bW - 16, 12);
                ctx.fillText("الردود الآلية تعمل في أقل من ثانية 👍", bW - 16, 32);
                ctx.font = "500 10.5px 'Plus Jakarta Sans'"; ctx.fillStyle = '#8E8E93'; ctx.textAlign = 'left'; ctx.fillText("10:16 ص", 16, bH - 20);
                ctx.restore();
            }

            // 5. Telegram Message 5
            const tgM5 = springOvershoot(clamp((time - 28.6) / 0.5), 1.8);
            if (tgM5 > 0) {
                ctx.save(); ctx.translate(-phoneW / 2 + 20, tgFeedY + 342); ctx.scale(tgM5, tgM5);
                const b3W = 340, b3H = 60; ctx.fillStyle = '#EEFFDE'; ctx.beginPath(); ctx.roundRect(0, 0, b3W, b3H, [4, 16, 16, 16]); ctx.fill();
                ctx.textAlign = 'right'; ctx.textBaseline = 'middle'; ctx.font = "600 15px 'IBM Plex Sans Arabic'"; ctx.fillStyle = '#000000';
                ctx.fillText("ألف مبروك! البوت الآن يتولى كافة", b3W - 14, 18);
                ctx.fillText("الاستفسارات وإتمام المبيعات تلقائياً ✓", b3W - 14, 40);
                ctx.font = "500 10.5px 'Plus Jakarta Sans'"; ctx.fillStyle = '#8E8E93'; ctx.textAlign = 'left'; ctx.fillText("10:16 ص", 24, 46);
                CustomSVGs.doubleBlueTick(ctx, 12, 46);
                ctx.restore();
            }

            // TELEGRAM SPLASH SCREEN (24.0s - 25.4s)
            if (time >= 24.0 && time < 25.5) {
                const splashAlpha = time < 25.0 ? 1.0 : clamp(1.0 - (time - 25.0) / 0.45);
                ctx.save();
                ctx.globalAlpha = splashAlpha;
                const splashScale = springOvershoot(clamp((time - 24.2) / 0.6), 1.8);
                drawNativeSplashScreen(ctx, phoneW, phoneH, topY, appLogos.telegram, splashScale, "Telegram", "fast. secure. powerful.", false);
                ctx.restore();
            }

            // Dynamic Island
            ctx.fillStyle = '#000000'; ctx.beginPath(); ctx.roundRect(-56, topY + 12, 112, 32, 16); ctx.fill();
            ctx.fillStyle = '#0a0a0c'; ctx.beginPath(); ctx.arc(-26, topY + 28, 5.5, 0, Math.PI * 2); ctx.fill();

            ctx.restore(); ctx.restore();

            ctx.restore(); // End Global Camera Transform
        }

        // ============ FIXED TECHNICAL LAYER (RUNTIME ENGINE) ============
        const canvas = document.getElementById('videoCanvas');
        const ctx = canvas.getContext('2d', { willReadFrequently: true });
        const statusText = document.getElementById('status-text');
        const spinner = document.getElementById('spinner');

        let audioAudioEl = null;
        let sharedAudioCtx = null;
        let state = { currentTime: 0, isRendering: false, animationFrameId: null };

        window.renderStatus = 'loading';

        function logToConsole(msg, type = 'info') {
            const output = document.getElementById('console-output');
            const line = document.createElement('div');
            line.className = `log-line log-${type}`;
            line.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
            output.appendChild(line);
            output.scrollTop = output.scrollHeight;
        }

        function startPreviewLoop() {
            if (state.animationFrameId) cancelAnimationFrame(state.animationFrameId);
            const startTime = performance.now();

            async function loop(now) {
                if (state.isRendering) return;
                const elapsed = (now - startTime) / 1000;
                const currTime = elapsed % CONFIG.duration;
                state.currentTime = currTime;
                await drawSceneAtTime(currTime);

                if (currTime < CONFIG.duration) {
                    state.animationFrameId = requestAnimationFrame(loop);
                } else {
                    statusText.textContent = "جاهز للعرض والتصدير ✓";
                    spinner.style.display = 'none';
                }
            }
            state.animationFrameId = requestAnimationFrame(loop);
        }

        const OFOQ_FRAME_FORMAT = 'image/png';
        window.__ofoqTotalFrames = 0;
        window.__ofoqFps = 0;
        window.__ofoqOutputFilename = '';
        window.__ofoqAudioWavBase64 = null;

        async function __ofoqGetFrameBatch(startFrame, count) {
            const frames = [];
            for (let i = 0; i < count; i++) {
                const frameIndex = startFrame + i;
                if (frameIndex >= window.__ofoqTotalFrames) break;
                const timestamp = frameIndex / window.__ofoqFps;
                await drawSceneAtTime(timestamp);
                const dataUrl = canvas.toDataURL(OFOQ_FRAME_FORMAT);
                frames.push(dataUrl.substring(dataUrl.indexOf(',') + 1));
            }
            return frames;
        }
        window.__ofoqGetFrameBatch = __ofoqGetFrameBatch;

        document.getElementById('btn-replay').addEventListener('click', () => {
            statusText.textContent = "جاري عرض المعاينة الحية...";
            spinner.style.display = 'inline-block';
            startPreviewLoop();
        });

        document.getElementById('btn-toggle-console').addEventListener('click', () => {
            const modal = document.getElementById('console-modal');
            modal.style.display = modal.style.display === 'flex' ? 'none' : 'flex';
        });

        document.getElementById('btn-close-console').addEventListener('click', () => {
            document.getElementById('console-modal').style.display = 'none';
        });

        document.getElementById('btn-render-start').addEventListener('click', () => {
            logToConsole("التصدير الفعلي يتم عبر محرك render-runner.js (Node + ffmpeg).", 'warn');
        });

        async function init() {
            try {
                await prepareIdentity();
                canvas.width = CONFIG.width;
                canvas.height = CONFIG.height;

                const viewport = document.getElementById('viewport');
                viewport.style.aspectRatio = `${CONFIG.width} / ${CONFIG.height}`;
                viewport.style.width = `min(94vw, calc(86vh * (${CONFIG.width} / ${CONFIG.height})))`;
                viewport.style.height = `min(94vw, calc(86vh * (${CONFIG.width} / ${CONFIG.height})))`;

                window.__ofoqFps = CONFIG.fps;
                window.__ofoqTotalFrames = Math.ceil(CONFIG.duration * CONFIG.fps);
                window.__ofoqOutputFilename = `${OUTPUT_FILENAME}.mp4`;

                statusText.textContent = "محاكاة 5 قنوات جاهزة للعرض ✓";
                spinner.style.display = 'none';
                window.renderStatus = 'ready';
                
                await drawSceneAtTime(0);
                startPreviewLoop();
            } catch (err) {
                logToConsole("خطأ أثناء التهيئة: " + err.message, 'error');
                statusText.textContent = "حدث خطأ أثناء تحميل المشهد";
                window.__renderError = err.message;
                window.renderStatus = 'error';
            }
        }
        window.addEventListener('load', init);
    </script>
</body>
