<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Master CRM Suite - Complete Bottom-Up Elevation Simulation</title>

    <!-- FONT IMPORTS -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@500;600;700;800;900&display=swap" rel="stylesheet">

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body {
            background-color: #f5f5f5; color: #0a0f1d;
            font-family: 'IBM Plex Sans Arabic', 'Plus Jakarta Sans', sans-serif;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            min-height: 100vh; min-height: 100dvh; overflow: hidden; padding: 10px;
        }
        #viewport {
            position: relative;
            max-height: 86vh;
            max-width: 94vw;
            width: auto;
            height: auto;
            background: #f5f5f5;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.05), 0 0 1px 1px rgba(0, 0, 0, 0.02);
            border-radius: 18px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        canvas { width: 100%; height: 100%; object-fit: contain; display: block; }
        #hud {
            position: absolute; top: 16px; right: 16px;
            background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(14px);
            color: #0a0f1d; padding: 6px 14px; border-radius: 30px;
            font-size: 12px; font-weight: 700; display: flex; align-items: center; gap: 8px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05); border: 1px solid rgba(0, 0, 0, 0.05); z-index: 10;
        }
        .spinner {
            width: 12px; height: 12px; border: 2px solid #e5e5ea;
            border-top: 2px solid #0a0f1d; border-radius: 50%; animation: spin 0.8s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        #controls-overlay {
            position: absolute; bottom: 16px; left: 50%; transform: translateX(-50%);
            display: flex; gap: 8px; z-index: 10; background: rgba(255, 255, 255, 0.92);
            padding: 6px 12px; border-radius: 40px; backdrop-filter: blur(16px);
            border: 1px solid rgba(0, 0, 0, 0.05); box-shadow: 0 10px 30px rgba(0,0,0,0.08);
        }
        .btn {
            font-family: inherit; font-size: 12px; font-weight: 700; padding: 6px 14px;
            border-radius: 20px; border: none; cursor: pointer; display: flex;
            align-items: center; gap: 6px; transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .btn-preview { background: #f1f5f9; color: #0f172a; }
        .btn-preview:hover { background: #e2e8f0; }
        .btn-render { background: #1a73e8; color: #ffffff; }
        .btn-render:hover { background: #1557b0; }
        #console-modal {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 680px; max-width: 92vw; height: 400px; background: #ffffff;
            border: 1px solid #e5e5ea; border-radius: 14px; box-shadow: 0 30px 80px rgba(0,0,0,0.15);
            z-index: 100; display: none; flex-direction: column; overflow: hidden;
        }
        #console-header {
            background: #f8fafc; padding: 12px 18px; display: flex; color: #0f172a;
            justify-content: space-between; align-items: center; font-size: 13px; font-weight: bold;
            border-bottom: 1px solid #e2e8f0;
        }
        #console-output {
            flex: 1; padding: 14px; overflow-y: auto; font-family: monospace;
            font-size: 12px; color: #334155; background: #ffffff; line-height: 1.6;
        }
        .log-line { margin-bottom: 4px; }
        .log-info { color: #1a73e8; }
        .log-warn { color: #d97706; }
        .log-error { color: #dc2626; }
    </style>
</head>
<body>
    <div id="viewport">
        <canvas id="videoCanvas"></canvas>
        <div id="hud"><div class="spinner" id="spinner"></div><span id="status-text">جاري تحميل أيقونات المنظومة...</span></div>
        <div id="controls-overlay">
            <button class="btn btn-preview" id="btn-replay">إعادة العرض</button>
            <button class="btn btn-toggle-console" id="btn-toggle-console">السجل البرمجي</button>
            <button class="btn btn-render" id="btn-render-start">تصدير المشهد</button>
        </div>
    </div>

    <div id="console-modal">
        <div id="console-header">
            <span>سجل النظام</span>
            <button class="btn btn-preview" id="btn-close-console" style="color:#fff; background:#ef4444; border:none; padding:4px 14px;">إغلاق</button>
        </div>
        <div id="console-output"></div>
    </div>

    <script type="module">
        // ============ IDENTITY LAYER ============
        const CONFIG = {
            fps: 30,
            width: 1920,
            height: 1080,
            duration: 30.0
        };
        const OUTPUT_FILENAME = 'master_crm_bottom_up_suite';
        let audioBuffer = null;

        function clamp(v, min = 0, max = 1) { return Math.max(min, Math.min(max, v)); }
        
        function springOvershoot(t, tension = 1.85) {
            t = clamp(t);
            return 1 + (tension + 1) * Math.pow(t - 1, 3) + tension * Math.pow(t - 1, 2);
        }

        function easeOutExpo(t) {
            t = clamp(t);
            return t === 1 ? 1 : 1 - Math.pow(2, -10 * t);
        }

        function easeInOutCubic(t) { 
            t = clamp(t);
            return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; 
        }

        // ============ ICONIFY NATIVE LOGOS LOADER ============
        const appIcons = {
            googleCalendar: null,
            microsoftExcel: null,
            googleGmail: null
        };

        const ICONIFY_DATA_URIS = {
            googleCalendar: 'data:image/svg+xml;utf8,' + encodeURIComponent(`
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192">
                  <path fill="#ffffff" d="M148 24H44a20 20 0 0 0-20 20v104a20 20 0 0 0 20 20h104a20 20 0 0 0 20-20V44a20 20 0 0 0-20-20Z"/>
                  <path fill="#4285F4" d="M44 24h104c11.046 0 20 8.954 20 20v14H24V44c0-11.046 8.954-20 20-20Z"/>
                  <path fill="#EA4335" d="M168 44v32H24V44c0-11.046 8.954-20 20-20h104c11.046 0 20 8.954 20 20Z"/>
                  <path fill="#34A853" d="M168 148c0 11.046-8.954 20-20 20H44c-11.046 0-20-8.954-20-20v-30h144v30Z"/>
                  <path fill="#FBBC04" d="M24 118v30c0 11.046 8.954 20 20 20h14V118H24Z"/>
                  <text x="96" y="132" fill="#1A73E8" font-family="'Plus Jakarta Sans', sans-serif" font-size="76" font-weight="800" text-anchor="middle">31</text>
                </svg>
            `),
            microsoftExcel: 'data:image/svg+xml;utf8,' + encodeURIComponent(`
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
                  <path fill="#107c41" d="M37 6H17a2 2 0 0 0-2 2v32a2 2 0 0 0 2 2h20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2z"/>
                  <path fill="#0e5c2f" d="M37 6H27v36h10a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2z"/>
                  <path fill="#33c481" d="M27 12H19v24h8a2 2 0 0 0 2-2V14a2 2 0 0 0-2-2z"/>
                  <rect x="5" y="10" width="18" height="28" rx="2" fill="#107c41"/>
                  <path fill="#ffffff" d="M9.8 17.5h3l2.2 4.6 2.2-4.6h3l-3.5 5.5 3.7 6.5h-3.1l-2.4-4.8-2.5 4.8H9.4l3.8-6.5-3.4-5.5z"/>
                </svg>
            `),
            googleGmail: 'data:image/svg+xml;utf8,' + encodeURIComponent(`
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                  <path fill="#4285F4" d="M24 5.457v13.909c0 .904-.732 1.636-1.636 1.636h-3.819V11.73L12 16.64l-6.545-4.91v9.272H1.636A1.636 1.636 0 0 1 0 19.366V5.457c0-2.023 2.309-3.178 3.927-1.964L12 9.545l8.073-6.052C21.69 2.28 24 3.434 24 5.457z"/>
                  <path fill="#34A853" d="M0 19.366c0 .904.732 1.636 1.636 1.636h3.819V11.73L0 7.82v11.546z"/>
                  <path fill="#EA4335" d="M18.545 11.73v9.272h3.819c.904 0 1.636-.732 1.636-1.636V7.82l-5.455 3.91z"/>
                  <path fill="#FBBC04" d="M20.073 3.493L12 9.545 3.927 3.493C2.309 2.279 0 3.434 0 5.457V7.82l12 9 12-9V5.457c0-2.023-2.309-3.178-3.927-1.964z"/>
                  <path fill="#C5221F" d="M18.545 11.73L24 7.82V5.457c0-2.023-2.309-3.178-3.927-1.964L12 9.545l6.545 2.185z"/>
                </svg>
            `)
        };

        function fetchIconifyIcon(iconKey, apiPath) {
            return new Promise((resolve) => {
                const img = new Image();
                img.crossOrigin = 'anonymous';
                img.onload = () => resolve(img);
                img.onerror = () => {
                    const fallbackImg = new Image();
                    fallbackImg.onload = () => resolve(fallbackImg);
                    fallbackImg.src = ICONIFY_DATA_URIS[iconKey];
                };
                img.src = `https://api.iconify.design/${apiPath}.svg`;
            });
        }

        // 24x24 Vector Paths
        const SVG_PATHS = {
            menu: new Path2D("M3 12h18M3 6h18M3 18h18"),
            search: new Path2D("M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"),
            settings: new Path2D("M12 15a3 3 0 100-6 3 3 0 000 6z M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-2 2 2 2 0 01-2-2v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83 0 2 2 0 010-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H3a2 2 0 01-2-2 2 2 0 012-2h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 010-2.83 2 2 0 012.83 0l.06.06a1.65 1.65 0 001.82.33H9a1.65 1.65 0 001-1.51V3a2 2 0 012-2 2 2 0 012 2v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 0 2 2 0 010 2.83l-.06.06a1.65 1.65 0 00-.33 1.82V9a1.65 1.65 0 001.51 1H21a2 2 0 012 2 2 2 0 01-2 2h-.09a1.65 1.65 0 00-1.51 1z"),
            chevronRight: new Path2D("M9 6l6 6-6 6"),
            chevronLeft: new Path2D("M15 18l-6-6 6-6"),
            chevronDown: new Path2D("M6 9l6 6 6-6"),
            plus: new Path2D("M12 5v14M5 12h14"),
            check: new Path2D("M20 6L9 17l-5-5"),
            gridApps: new Path2D("M4 4h4v4H4z M10 4h4v4H4z M16 4h4v4H4z M4 10h4v4H4z M10 10h4v4H4z M16 10h4v4H4z M4 16h4v4H4z M10 16h4v4H4z M16 16h4v4H4z"),
            save: new Path2D("M19 21H5a2 2 0 01-2-2V5a2 2 0 012-2h11l5 5v11a2 2 0 01-2 2zM17 21v-8H7v8M7 3v5h8"),
            undo: new Path2D("M3 7v6h6M21 17a9 9 0 00-9-9 9 9 0 00-6 2.3L3 13"),
            redo: new Path2D("M21 7v6h-6M3 17a9 9 0 019-9 9 9 0 016 2.3L21 13"),
            sigma: new Path2D("M18 4H6l7 8-7 8h12"),
            filter: new Path2D("M22 3H2l8 9.46V19l4 2v-8.54L22 3z"),
            sparkle: new Path2D("M12 2L14.5 9.5L22 12L14.5 14.5L12 22L9.5 14.5L2 12L9.5 9.5L12 2Z"),
            star: new Path2D("M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"),
            trash: new Path2D("M3 6h18m-2 0v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"),
            replyArrow: new Path2D("M3 10h10a5 5 0 0 1 5 5v2m-15-7l4-4m-4 4l4 4"),
            replyAll: new Path2D("M7 10h8a5 5 0 0 1 5 5v2M3 10l4-4M3 10l4 4M7 6l4-4M7 14l4 4"),
            forward: new Path2D("M21 10H11a5 5 0 0 0-5 5v2m15-7l-4-4m4 4l-4 4")
        };

        function drawNativeSVG(ctx, path, x, y, size = 20, color = '#1f1f1f', lineWidth = 2.0, isFill = false) {
            ctx.save();
            ctx.translate(x, y);
            const scale = size / 24;
            ctx.scale(scale, scale);
            ctx.translate(-12, -12);
            
            if (isFill) {
                ctx.fillStyle = color;
                ctx.fill(path);
            } else {
                ctx.strokeStyle = color;
                ctx.lineWidth = lineWidth / scale;
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';
                ctx.stroke(path);
            }
            ctx.restore();
        }

        async function prepareIdentity() {
            await document.fonts.ready;
            const [gCal, mExcel, gGmail] = await Promise.all([
                fetchIconifyIcon('googleCalendar', 'logos:google-calendar'),
                fetchIconifyIcon('microsoftExcel', 'vscode-icons:file-type-excel2'),
                fetchIconifyIcon('googleGmail', 'logos:google-gmail')
            ]);
            appIcons.googleCalendar = gCal;
            appIcons.microsoftExcel = mExcel;
            appIcons.googleGmail = gGmail;
        }

        // ============ MAIN RENDERING ENGINE ============
        async function drawSceneAtTime(time) {
            ctx.clearRect(0, 0, CONFIG.width, CONFIG.height);

            // 1. Studio Background (100% Pure #f5f5f5 - NO GRID)
            ctx.fillStyle = '#f5f5f5';
            ctx.fillRect(0, 0, CONFIG.width, CONFIG.height);

            // Ambient Center Radial Light
            const centerGlow = ctx.createRadialGradient(
                CONFIG.width / 2, CONFIG.height / 2, 80,
                CONFIG.width / 2, CONFIG.height / 2, CONFIG.width * 0.85
            );
            centerGlow.addColorStop(0, 'rgba(255, 255, 255, 0.98)');
            centerGlow.addColorStop(1, 'rgba(245, 245, 245, 0)');
            ctx.fillStyle = centerGlow;
            ctx.fillRect(0, 0, CONFIG.width, CONFIG.height);

            const winW = 1540;
            const winH = 880;
            const winX = CONFIG.width / 2;
            const winY = CONFIG.height / 2;

            // =========================================================================
            // 1. TYPOGRAPHIC INTRO 1: CALENDAR [0.0s - 2.0s]
            // =========================================================================
            if (time < 2.2) {
                const typoAlpha = time < 1.4 ? 1.0 : clamp(1.0 - (time - 1.4) / 0.5);
                ctx.save();
                ctx.globalAlpha = typoAlpha;

                const words1 = [
                    { text: "تنظيم", start: 0.05, dur: 0.38, tension: 1.6 },
                    { text: "المواعيد", start: 0.22, dur: 0.34, tension: 1.7 },
                    { text: "وحجز", start: 0.36, dur: 0.30, tension: 1.8 },
                    { text: "الجلسات", start: 0.48, dur: 0.26, tension: 1.9 },
                    { text: "الذكية", start: 0.58, dur: 0.24, tension: 2.0 },
                    { text: "تلقائياً", start: 0.67, dur: 0.22, tension: 2.1 }
                ];

                ctx.font = "900 64px 'IBM Plex Sans Arabic'";
                ctx.textAlign = "center";
                ctx.textBaseline = "middle";

                const wordGap = 26;
                const wordWidths = words1.map(w => ctx.measureText(w.text).width);
                const totalWidth = wordWidths.reduce((a, b) => a + b, 0) + (words1.length - 1) * wordGap;
                let currentX = (CONFIG.width / 2) + (totalWidth / 2);

                words1.forEach((w) => {
                    const wWidth = ctx.measureText(w.text).width;
                    const wCenter = currentX - wWidth / 2;
                    currentX -= (wWidth + wordGap);

                    const elapsed = time - w.start;
                    if (elapsed > 0) {
                        const progress = clamp(elapsed / w.dur);
                        const snap = easeOutExpo(progress);
                        const bounce = Math.sin(progress * Math.PI) * 0.05;
                        const finalP = clamp(snap + bounce);
                        const slideY = (1 - finalP) * 55;
                        const wordAlpha = clamp(elapsed / 0.16);

                        ctx.save();
                        ctx.globalAlpha = typoAlpha * wordAlpha;
                        ctx.translate(wCenter, CONFIG.height / 2 + slideY);
                        ctx.fillStyle = '#0a0f1d';
                        ctx.fillText(w.text, 0, 0);
                        ctx.restore();
                    }
                });
                ctx.restore();
                if (time < 1.45) return;
            }

            // =========================================================================
            // 2. SCENE 1: GOOGLE CALENDAR (BOTTOM-UP ELEVATION) [1.8s - 9.6s]
            // =========================================================================
            if (time >= 1.8 && time < 9.8) {
                // Rising from Bottom (+650px to 0px)
                const calEnterProg = springOvershoot(clamp((time - 1.8) / 1.1), 1.85);
                const calSlideY = (1 - calEnterProg) * 650;
                const calScale = 0.94 + 0.06 * calEnterProg;

                let calExitOffset = 0;
                if (time >= 8.8) {
                    const exitP = easeInOutCubic((time - 8.8) / 0.8);
                    calExitOffset = -exitP * 850;
                }

                ctx.save();
                ctx.translate(winX, winY + calSlideY + calExitOffset);
                ctx.scale(calScale, calScale);

                ctx.beginPath(); ctx.roundRect(-winW / 2, -winH / 2, winW, winH, 20); ctx.fillStyle = '#ffffff'; ctx.fill();
                const edgeGrad1 = ctx.createLinearGradient(-winW / 2, -winH / 2, winW / 2, winH / 2);
                edgeGrad1.addColorStop(0, '#ffffff'); edgeGrad1.addColorStop(0.3, '#e5e5ea'); edgeGrad1.addColorStop(0.7, '#d4d4d8'); edgeGrad1.addColorStop(1, '#e5e5ea');
                ctx.strokeStyle = edgeGrad1; ctx.lineWidth = 4.0; ctx.stroke();

                ctx.save();
                ctx.beginPath(); ctx.roundRect(-winW / 2 + 2, -winH / 2 + 2, winW - 4, winH - 4, 18); ctx.clip();
                ctx.fillStyle = '#ffffff'; ctx.fillRect(-winW / 2, -winH / 2, winW, winH);

                // Chrome Bar
                const chromeBarH = 42;
                ctx.fillStyle = '#F1F3F4'; ctx.fillRect(-winW / 2, -winH / 2, winW, chromeBarH);
                ctx.strokeStyle = '#E0E3E7'; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(-winW / 2, -winH / 2 + chromeBarH); ctx.lineTo(winW / 2, -winH / 2 + chromeBarH); ctx.stroke();
                const tlX = -winW / 2 + 26, tlY = -winH / 2 + chromeBarH / 2;
                ctx.fillStyle = '#ED6A5E'; ctx.beginPath(); ctx.arc(tlX, tlY, 5.5, 0, Math.PI * 2); ctx.fill();
                ctx.fillStyle = '#F5BF4F'; ctx.beginPath(); ctx.arc(tlX + 16, tlY, 5.5, 0, Math.PI * 2); ctx.fill();
                ctx.fillStyle = '#62C554'; ctx.beginPath(); ctx.arc(tlX + 32, tlY, 5.5, 0, Math.PI * 2); ctx.fill();

                const urlW = 520, urlH = 26;
                ctx.fillStyle = '#ffffff';
                ctx.beginPath(); ctx.roundRect(-urlW / 2, -winH / 2 + 8, urlW, urlH, 13); ctx.fill();
                ctx.strokeStyle = '#E0E3E7'; ctx.lineWidth = 1; ctx.stroke();
                ctx.font = "500 11.5px 'Plus Jakarta Sans'"; ctx.fillStyle = '#5F6368';
                ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText("calendar.google.com/calendar/u/0/r/week", 0, -winH / 2 + 21);

                // Main Calendar Header (Wide Spacing)
                const mainHeaderY = -winH / 2 + chromeBarH;
                const mainHeaderH = 68;
                ctx.fillStyle = '#ffffff'; ctx.fillRect(-winW / 2, mainHeaderY, winW, mainHeaderH);
                ctx.strokeStyle = '#E0E3E7'; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(-winW / 2, mainHeaderY + mainHeaderH); ctx.lineTo(winW / 2, mainHeaderY + mainHeaderH); ctx.stroke();

                const hY = mainHeaderY + mainHeaderH / 2;
                let curRightX = winW / 2 - 28;

                drawNativeSVG(ctx, SVG_PATHS.menu, curRightX, hY, 22, '#5F6368', 2.0);
                curRightX -= 44;

                // Real Google Calendar Logo
                if (appIcons.googleCalendar) {
                    ctx.drawImage(appIcons.googleCalendar, curRightX - 18, hY - 18, 36, 36);
                }
                curRightX -= 36;

                ctx.textAlign = 'right'; ctx.font = "800 20px 'IBM Plex Sans Arabic'"; ctx.fillStyle = '#3C4043';
                ctx.fillText("تقويم Google", curRightX, hY + 4);
                curRightX -= ctx.measureText("تقويم Google").width + 50;

                const todayBtnW = 68, todayBtnH = 36;
                ctx.fillStyle = '#ffffff'; ctx.beginPath(); ctx.roundRect(curRightX - todayBtnW, hY - todayBtnH/2, todayBtnW, todayBtnH, 6); ctx.fill();
                ctx.strokeStyle = '#DADCE0'; ctx.lineWidth = 1.2; ctx.stroke();
                ctx.font = "800 13.5px 'IBM Plex Sans Arabic'"; ctx.fillStyle = '#3C4043';
                ctx.textAlign = 'center'; ctx.fillText("اليوم", curRightX - todayBtnW / 2, hY + 2);
                curRightX -= todayBtnW + 24;

                drawNativeSVG(ctx, SVG_PATHS.chevronRight, curRightX, hY, 18, '#5F6368', 2.2);
                curRightX -= 28;
                drawNativeSVG(ctx, SVG_PATHS.chevronLeft, curRightX, hY, 18, '#5F6368', 2.2);
                curRightX -= 34;

                ctx.textAlign = 'right'; ctx.font = "800 20px 'IBM Plex Sans Arabic'"; ctx.fillStyle = '#3C4043';
                ctx.fillText("يناير ٢٠٢٦", curRightX, hY + 3);

                // Header Left Controls
                let curLeftX = -winW / 2 + 28;
                ctx.beginPath(); ctx.arc(curLeftX + 16, hY, 17, 0, Math.PI * 2); ctx.fillStyle = '#1A73E8'; ctx.fill();
                ctx.font = "800 13px 'Plus Jakarta Sans'"; ctx.fillStyle = '#ffffff'; ctx.textAlign = 'center'; ctx.fillText("G", curLeftX + 16, hY + 1);
                curLeftX += 54;
                drawNativeSVG(ctx, SVG_PATHS.gridApps, curLeftX, hY, 18, '#5F6368', 1.8, true);
                curLeftX += 40;
                drawNativeSVG(ctx, SVG_PATHS.settings, curLeftX, hY, 20, '#5F6368', 2.0);
                curLeftX += 40;

                    ctx.fillText("to me, Rob, Jess & Mark ⌄", cW - 52, 38);

                    ctx.font = "400 12.5px 'Plus Jakarta Sans'"; ctx.fillStyle = '#1f1f1f';
                    ctx.fillText("Hi folks, I wanted to check in on the progress of our website launch project. It's been a few days since our last meeting,", cW - 20, 68);
                    ctx.fillText("and I'm keen to see where we stand on Content Finalization, SEO Implementation, and QA Testing. I'll schedule a quick", cW - 20, 88);
                    ctx.fillText("follow-up meeting tomorrow to discuss next steps.", cW - 20, 108);
                    ctx.restore();
                }

                // Email 2: Rob Gonzales
                const e2Y = e1Y + 148;
                const e2Prog = springOvershoot(clamp((time - 22.8) / 0.5), 1.8);
                if (e2Prog > 0) {
                    ctx.save(); ctx.translate(threadX + 40, e2Y); ctx.scale(e2Prog, e2Prog);
                    const cW = threadW - 75, cH = 90;
                    ctx.fillStyle = '#FFFFFF'; ctx.beginPath(); ctx.roundRect(0, 0, cW, cH, 12); ctx.fill();
                    ctx.strokeStyle = '#E0E3E7'; ctx.lineWidth = 1; ctx.stroke();
                    ctx.fillStyle = '#0f172a'; ctx.beginPath(); ctx.arc(cW - 26, 26, 15, 0, Math.PI * 2); ctx.fill();
                    ctx.fillStyle = '#ffdfd3'; ctx.beginPath(); ctx.arc(cW - 26, 24, 7, 0, Math.PI * 2); ctx.fill();
                    ctx.fillStyle = '#0284c7'; ctx.beginPath(); ctx.arc(cW - 26, 35, 8, Math.PI, 0); ctx.fill();

                    ctx.textAlign = 'right'; ctx.font = "800 14px 'Plus Jakarta Sans'"; ctx.fillStyle = '#1f1f1f';
                    ctx.fillText("Rob Gonzales", cW - 52, 22);
                    ctx.font = "500 11px 'Plus Jakarta Sans'"; ctx.fillStyle = '#5e5e5e';
                    ctx.fillText("9:40 AM", cW - 152, 22);
                    ctx.fillText("to me, Rob, Jess & Mark ⌄", cW - 52, 38);

                    ctx.font = "400 12.5px 'Plus Jakarta Sans'"; ctx.fillStyle = '#1f1f1f';
                    ctx.fillText("We've made progress on Content Finalization and SEO Implementation, while QA testing is still ongoing. Let's definitely follow up tomorrow!", cW - 20, 68);
                    ctx.restore();
                }

                // Email 3: Jess Lee
                const e3Y = e2Y + 102;
                const e3Prog = springOvershoot(clamp((time - 23.6) / 0.5), 1.8);
                if (e3Prog > 0) {
                    ctx.save(); ctx.translate(threadX + 40, e3Y); ctx.scale(e3Prog, e3Prog);
                    const cW = threadW - 75, cH = 95;
                    ctx.fillStyle = '#FFFFFF'; ctx.beginPath(); ctx.roundRect(0, 0, cW, cH, 12); ctx.fill();
                    ctx.strokeStyle = '#E0E3E7'; ctx.lineWidth = 1; ctx.stroke();
                    ctx.fillStyle = '#0f172a'; ctx.beginPath(); ctx.arc(cW - 26, 26, 15, 0, Math.PI * 2); ctx.fill();
                    ctx.fillStyle = '#ec4899'; ctx.beginPath(); ctx.arc(cW - 24, 26, 7, 0, Math.PI * 2); ctx.fill();
                    ctx.fillStyle = '#fbcfe8'; ctx.beginPath(); ctx.arc(cW - 30, 23, 4, 0, Math.PI * 2); ctx.fill();

                    ctx.textAlign = 'right'; ctx.font = "800 14px 'Plus Jakarta Sans'"; ctx.fillStyle = '#1f1f1f';
                    ctx.fillText("Jess Lee", cW - 52, 22);
                    ctx.font = "500 11px 'Plus Jakarta Sans'"; ctx.fillStyle = '#5e5e5e';
                    ctx.fillText("9:45 AM", cW - 120, 22);

                // Reply Actions Bar
                const replyBarY = e3Y + 115;

                ctx.fillStyle = '#ffffff'; ctx.beginPath(); ctx.roundRect(-90, -18, 90, 36, 18); ctx.fill();

                ctx.fillStyle = '#ffffff'; ctx.beginPath(); ctx.roundRect(-375, -18, 125, 36, 18); ctx.fill();

                ctx.restore();

                ctx.restore(); ctx.restore();

        }

        // ============ FIXED TECHNICAL LAYER (RUNTIME ENGINE) ============
        const canvas = document.getElementById('videoCanvas');
        const ctx = canvas.getContext('2d', { willReadFrequently: true });
        const statusText = document.getElementById('status-text');
        const spinner = document.getElementById('spinner');

        let audioAudioEl = null;
        let sharedAudioCtx = null;
        let state = { currentTime: 0, isRendering: false, animationFrameId: null };

        window.renderStatus = 'loading';

        function logToConsole(msg, type = 'info') {
            const output = document.getElementById('console-output');
            const line = document.createElement('div');
            line.className = `log-line log-${type}`;
            line.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
            output.appendChild(line);
            output.scrollTop = output.scrollHeight;
        }

        function startPreviewLoop() {
            if (state.animationFrameId) cancelAnimationFrame(state.animationFrameId);
            const startTime = performance.now();

            async function loop(now) {
                if (state.isRendering) return;
                const elapsed = (now - startTime) / 1000;
                const currTime = elapsed % CONFIG.duration;
                state.currentTime = currTime;
                await drawSceneAtTime(currTime);

                if (currTime < CONFIG.duration) {
                    state.animationFrameId = requestAnimationFrame(loop);
                } else {
                    statusText.textContent = "Master Simulation Suite Ready ✓";
                    spinner.style.display = 'none';
                }
            }
            state.animationFrameId = requestAnimationFrame(loop);
        }

        const OFOQ_FRAME_FORMAT = 'image/png';
        window.__ofoqTotalFrames = 0;
        window.__ofoqFps = 0;
        window.__ofoqOutputFilename = '';
        window.__ofoqAudioWavBase64 = null;

        async function __ofoqGetFrameBatch(startFrame, count) {
            const frames = [];
            for (let i = 0; i < count; i++) {
                const frameIndex = startFrame + i;
                if (frameIndex >= window.__ofoqTotalFrames) break;
                const timestamp = frameIndex / window.__ofoqFps;
                await drawSceneAtTime(timestamp);
                const dataUrl = canvas.toDataURL(OFOQ_FRAME_FORMAT);
                frames.push(dataUrl.substring(dataUrl.indexOf(',') + 1));
            }
            return frames;
        }
        window.__ofoqGetFrameBatch = __ofoqGetFrameBatch;

        document.getElementById('btn-replay').addEventListener('click', () => {
            statusText.textContent = "Replaying Suite Simulation...";
            spinner.style.display = 'inline-block';
            startPreviewLoop();
        });

        document.getElementById('btn-toggle-console').addEventListener('click', () => {
            const modal = document.getElementById('console-modal');
            modal.style.display = modal.style.display === 'flex' ? 'none' : 'flex';
        });

        document.getElementById('btn-close-console').addEventListener('click', () => {
            document.getElementById('console-modal').style.display = 'none';
        });

        document.getElementById('btn-render-start').addEventListener('click', () => {
            logToConsole("Export handled via OFOQ runner (Node + ffmpeg).", 'warn');
        });

        async function init() {
            try {
                await prepareIdentity();
                canvas.width = CONFIG.width;
                canvas.height = CONFIG.height;

                const viewport = document.getElementById('viewport');
                viewport.style.aspectRatio = `${CONFIG.width} / ${CONFIG.height}`;
                viewport.style.width = `min(94vw, calc(86vh * (${CONFIG.width} / ${CONFIG.height})))`;

                window.__ofoqFps = CONFIG.fps;
                window.__ofoqTotalFrames = Math.ceil(CONFIG.duration * CONFIG.fps);
                window.__ofoqOutputFilename = `${OUTPUT_FILENAME}.mp4`;

                statusText.textContent = "Master Simulation Suite Ready ✓";
                spinner.style.display = 'none';
                window.renderStatus = 'ready';
                
                await drawSceneAtTime(0);
                startPreviewLoop();
            } catch (err) {
                logToConsole("Initialization error: " + err.message, 'error');
                statusText.textContent = "Error loading scene";
                window.__renderError = err.message;
                window.renderStatus = 'error';
            }
        }
        window.addEventListener('load', init);
    </script>
